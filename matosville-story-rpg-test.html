<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matosville Story RPG – Test</title><style>
*{box-sizing:border-box}body{margin:0;background:#100b18;color:#fff;font-family:Arial,sans-serif;background:radial-gradient(circle at top,#3b1d58,#100b18 55%);min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:18px}.top{text-align:center}.top h1{margin:4px;color:#f5d65d;text-shadow:3px 3px #000}.tag{color:#d6b8ff}.panel{background:#181323eF;border:2px solid #7446a8;border-radius:16px;padding:18px;margin-top:14px;box-shadow:0 10px 35px #0008}.scene{min-height:170px;background:linear-gradient(135deg,#35234a,#172d32);border-radius:12px;padding:20px;display:flex;align-items:end;font-size:21px;font-weight:bold}.text{line-height:1.55;font-size:17px}.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.btn{border:0;border-radius:11px;padding:13px;font-weight:900;color:#fff;background:#7041ba;cursor:pointer;font-size:15px}.btn:hover{filter:brightness(1.2)}.btn.red{background:#9f3341}.btn.green{background:#277b55}.hidden{display:none!important}.battlefield{display:grid;grid-template-columns:1fr 120px 1fr;gap:12px;align-items:center;min-height:260px;background:linear-gradient(#39244b,#1b2930);border-radius:13px;padding:15px}.team{display:flex;flex-direction:column;gap:10px}.fighter{background:#15131c;border:2px solid #555;border-radius:11px;padding:10px}.fighter.active{border-color:#ffe357;box-shadow:0 0 18px #ffe35755}.name{font-weight:900}.bar{height:10px;background:#3a303f;border-radius:10px;overflow:hidden;margin:5px 0}.hp{height:100%;background:#55d477}.enemy .hp{background:#ef5967}.center{text-align:center;font-size:38px}.turn{font-size:14px;color:#ffd85c}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.log{height:105px;overflow:auto;background:#0d0b12;border-radius:9px;padding:10px;margin-top:10px;font-size:14px;line-height:1.45}.timing{height:24px;background:#30293b;border-radius:12px;position:relative;overflow:hidden;margin:10px 0}.zone{position:absolute;left:43%;width:14%;height:100%;background:#56c87888}.marker{position:absolute;width:8px;height:100%;background:#fff;left:0}.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:13px;color:#ddd}@media(max-width:700px){.battlefield{grid-template-columns:1fr 50px 1fr}.actions{grid-template-columns:1fr 1fr}.fighter{font-size:12px}.wrap{padding:8px}}</style></head><body><div class="wrap"><div class="top"><h1>MATOSVILLE STORY RPG</h1><div class="tag">⚔ TESTVERSION · Entscheidungen + rundenbasierter Kampf</div></div>
<div id="story" class="panel"><div id="scene" class="scene"></div><div id="storyText" class="text"></div><div id="choices" class="choices"></div></div>
<div id="battle" class="panel hidden"><div class="stats"><b id="battleTitle"></b><span id="round"></span></div><div class="battlefield"><div id="heroes" class="team"></div><div class="center">⚔</div><div id="enemies" class="team enemy"></div></div><div id="timingWrap" class="hidden"><div>🎯 Timing! Drücke LEERTASTE möglichst im grünen Bereich.</div><div class="timing"><div class="zone"></div><div id="marker" class="marker"></div></div></div><div id="actions" class="actions"></div><div id="log" class="log"></div></div>
</div><script>
const $=id=>document.getElementById(id);let flags={},chapter=0,battleNo=0,turn=0,round=1,timingRAF=null,timingResolve=null;
const heroBase=[
{name:'🚛 Trucker Lönhard',max:120,hp:120,ep:40,atk:22,skill:'BIER-BUFF',desc:'Trinkt Bier: +50% Angriff für 2 Züge.',buff:0},
{name:'🐍 Fridolin',max:85,hp:85,ep:55,atk:16,skill:'ZUCKERSCHOCK',desc:'Schaden + Vergiftung.',buff:0},
{name:'🐃 EL VIKO',max:155,hp:155,ep:35,atk:27,skill:'BUFFEL-RAMME',desc:'Sehr starker Einzelangriff.',buff:0}];
let heroes=[];
const enemySets=[
[{name:'🧀 Käse-Kobold',max:75,hp:75,atk:13},{name:'🥖 Aggressives Baguette',max:65,hp:65,atk:15},{name:'🪑 Wütender Barhocker',max:90,hp:90,atk:11}],
[{name:'🌵 Kaktus Kevin',max:95,hp:95,atk:15},{name:'🦎 Steuer-Eidechse',max:80,hp:80,atk:17},{name:'🛒 Einkaufswagen',max:110,hp:110,atk:13}],
[{name:'🧀 XXL MOZZARELLA',max:230,hp:230,atk:21},{name:'🥛 Milch-Minion',max:80,hp:80,atk:14},{name:'🍅 Tomaten-Wächter',max:90,hp:90,atk:15}]];
let enemies=[];
function resetHeroes(){heroes=heroBase.map(x=>({...x,hp:x.max,ep:x.ep,buff:0,poison:0}))}
function story(scene,text,choices){$('story').classList.remove('hidden');$('battle').classList.add('hidden');$('scene').textContent=scene;$('storyText').innerHTML='<p>'+text+'</p>';$('choices').innerHTML='';choices.forEach(c=>{let b=document.createElement('button');b.className='btn '+(c.cls||'');b.textContent=c.t;b.onclick=c.fn;$('choices').appendChild(b)})}
function intro(){flags={};resetHeroes();story('🌵 ROUTE 69 · 14:03 UHR','Der letzte XXL-Mozzarella von Matosville wurde gestohlen. Niemand weiß warum er überhaupt wichtig ist. Trucker Lönhard erklärt ihn trotzdem zum „nationalen Notfall“. Fridolin behauptet, der Käse habe ihn zuerst beleidigt.',[
{t:'🍺 Erst zum Saloon',fn:()=>path('saloon')},{t:'🌵 Durch den Busch',fn:()=>path('busch')},{t:'🐃 EL VIKO entscheiden lassen',fn:()=>path('viko')}])}
function path(p){flags.path=p;if(p==='saloon'){heroes[0].atk+=4;story('🍺 SALOON','Lönhard trinkt aus Versehen drei „Taktik-Biere“. Sein Angriff steigt dauerhaft. Hinter dem Tresen lauert allerdings etwas völlig Unnötiges.',[{t:'⚔ Nachsehen',fn:()=>startBattle(0)}])}else if(p==='busch'){heroes[1].ep+=15;story('🌿 VERDÄCHTIGER BUSCH','Fridolin findet 14 Gummibärchen und nennt das „professionelle Spurensicherung“. Seine Energie steigt. Dann raschelt es.',[{t:'⚔ In den Busch springen',fn:()=>startBattle(1)}])}else{heroes[2].max+=20;heroes[2].hp+=20;story('🐃 EL VIKOS ABKÜRZUNG','EL VIKO läuft einfach durch eine Wand. Niemand hinterfragt es. Seine Lebenspunkte steigen – auf der anderen Seite wartet Ärger.',[{t:'⚔ Durch die Wand',fn:()=>startBattle(0)}])}}
function startBattle(n){battleNo=n;enemies=enemySets[n].map(e=>({...e,poison:0}));turn=0;round=1;$('story').classList.add('hidden');$('battle').classList.remove('hidden');$('battleTitle').textContent=n===2?'BOSS: DER KÄSE HAT SICH SELBST GESTOHLEN':'ZUFÄLLIGER, SINNLOSER KAMPF';log('Kampf beginnt!');render();playerTurn()}
function living(a){return a.filter(x=>x.hp>0)}
function render(){let h='';heroes.forEach((p,i)=>h+=card(p,i===turn&&p.hp>0,false));$('heroes').innerHTML=h;let e='';enemies.forEach(p=>e+=card(p,false,true));$('enemies').innerHTML=e;$('round').textContent='RUNDE '+round}
function card(p,active,enemy){let pct=Math.max(0,p.hp/p.max*100);return '<div class="fighter '+(active?'active ':'')+'"><div class="name">'+p.name+'</div><div class="bar"><div class="hp" style="width:'+pct+'%"></div></div><div>'+Math.max(0,Math.ceil(p.hp))+' / '+p.max+' HP'+(!enemy?' · '+p.ep+' EP':'')+'</div></div>'}
function log(t){$('log').innerHTML=t+'<br>'+$('log').innerHTML}
function playerTurn(){if(checkEnd())return;while(heroes[turn]&&heroes[turn].hp<=0)turn=(turn+1)%heroes.length;render();$('actions').innerHTML='';let p=heroes[turn];[['⚔ ANGRIFF','attack'],['✨ '+p.skill,'skill'],['🍕 ITEM','item'],['🛡 VERTEIDIGEN','guard']].forEach(([t,a])=>{let b=document.createElement('button');b.className='btn';b.textContent=t;b.onclick=()=>act(a);$('actions').appendChild(b)})}
async function act(a){$('actions').innerHTML='';let p=heroes[turn],target=living(enemies)[0];if(a==='item'){p.hp=Math.min(p.max,p.hp+35);log(p.name+' isst eine fragwürdige Pizza: +35 HP.');nextTurn();return}if(a==='guard'){p.guard=true;log(p.name+' verteidigt sich.');nextTurn();return}if(a==='skill'&&p.ep<12){log('Nicht genug EP!');playerTurn();return}let mult=1;if(a==='skill'){p.ep-=12;if(turn===0){p.buff=2;log('🍺 Lönhard aktiviert BIER-BUFF!');nextTurn();return}mult=turn===1?1.45:1.85;if(turn===1)target.poison=3}let timing=await timingGame();let dmg=Math.round(p.atk*(p.buff?1.5:1)*mult*timing);target.hp-=dmg;log(p.name+' trifft '+target.name+' für '+dmg+' Schaden!'+(timing>1.2?' PERFEKTES TIMING!':''));if(p.buff)p.buff--;nextTurn()}
function timingGame(){return new Promise(res=>{timingResolve=res;$('timingWrap').classList.remove('hidden');let start=performance.now();function go(t){let q=((t-start)%1200)/1200;let pos=q<.5?q*2:2-q*2;$('marker').style.left=(pos*98)+'%';timingRAF=requestAnimationFrame(go)}timingRAF=requestAnimationFrame(go);function hit(e){if(e.code!=='Space')return;e.preventDefault();finish()}function finish(){removeEventListener('keydown',hit);cancelAnimationFrame(timingRAF);let left=parseFloat($('marker').style.left)||0;$('timingWrap').classList.add('hidden');res(left>=42&&left<=57?1.5:left>=30&&left<=70?1.2:.85)}addEventListener('keydown',hit);setTimeout(()=>{if($('timingWrap').classList.contains('hidden'))return;finish()},1800)})}
function nextTurn(){if(checkEnd())return;turn++;if(turn>=heroes.length){turn=0;enemyPhase()}else playerTurn()}
function enemyPhase(){let es=living(enemies);if(!es.length){checkEnd();return}es.forEach(e=>{if(e.poison){e.hp-=8;e.poison--;log('☠ '+e.name+' erleidet Giftschaden.')}let hs=living(heroes);if(!hs.length)return;let t=hs[Math.floor(Math.random()*hs.length)],d=Math.round(e.atk*(.85+Math.random()*.3));if(t.guard){d=Math.ceil(d*.45);t.guard=false}t.hp-=d;log(e.name+' greift '+t.name+' an: '+d+' Schaden.')});round++;setTimeout(playerTurn,450)}
function checkEnd(){if(living(enemies).length===0){$('actions').innerHTML='';setTimeout(afterBattle,400);return true}if(living(heroes).length===0){$('actions').innerHTML='<button class="btn red" onclick="intro()">NOCHMAL VON VORNE</button>';log('💀 Das Team wurde besiegt. Der Mozzarella gewinnt vermutlich die Weltherrschaft.');return true}return false}
function afterBattle(){if(battleNo<2){heroes.forEach(h=>{h.hp=Math.min(h.max,h.hp+30);h.ep+=10});story('🏜 MATOSVILLE MARKTPLATZ','Nach dem Kampf liegt dort ein Zettel: „ICH HABE MICH SELBST GESTOHLEN. KOMMT ZUM KÜHLSCHRANK.“ Die Gruppe diskutiert 20 Minuten darüber, ob Käse schreiben kann.',[
{t:'🧀 Zum Kühlschrank',fn:()=>startBattle(2)},{t:'🔥 Zettel verbrennen',fn:()=>ending('fire')},{t:'🏃 Einfach nach Hause',fn:()=>ending('home')}])}else ending('cheese')}
function ending(e){let title,text;if(e==='fire'){title='🔥 ENDE 1: BEWEISE VERNICHTET';text='Der Zettel brennt. Niemand findet den Mozzarella. Lönhard erklärt den Fall trotzdem für gelöst.'}else if(e==='home'){title='🏠 ENDE 2: KEIN BOCK MEHR';text='Alle gehen nach Hause. Der Käse gründet später eine erfolgreiche Unternehmensberatung.'}else{title='🧀 ENDE 3: MOZZARELLA-FRIEDEN';text='Nach seiner Niederlage gesteht der XXL-Mozzarella: Er wollte nur Aufmerksamkeit. EL VIKO macht Nachos. Niemand lernt irgendetwas daraus.'}story(title,text+'<br><br><b>TESTVERSION BEENDET</b>',[{t:'🔄 Andere Entscheidungen testen',fn:intro}])}
intro();
</script></body></html>
