<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matosville Football 3v3 – Test</title><style>*{box-sizing:border-box}body{margin:0;background:#17131e;color:#fff;font-family:Arial,sans-serif;text-align:center}h1{margin:14px 8px 5px;font-size:clamp(20px,4vw,34px)}.sub{color:#d9c9ff;margin:0 8px 10px}.wrap{max-width:1100px;margin:auto;padding:0 10px 20px}canvas{width:100%;height:auto;display:block;border:5px solid #eee;border-radius:15px;background:#258943;box-shadow:0 8px 30px #0008;touch-action:none}.hud{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:10px;font-weight:800}.help{font-size:14px;line-height:1.5;color:#ddd}.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:800;cursor:pointer;margin:5px;background:#7b45d6;color:#fff}</style></head><body><div class="wrap"><h1>⚽ MATOSVILLE FOOTBALL – 3 VS 3</h1><p class="sub">Spielbare Grundversion 0.1</p><div class="hud"><span id="score">ROUTE 69 0 : 0 MATOSVILLE</span><span id="time">03:00</span></div><canvas id="c" width="1000" height="600"></canvas><button class="btn" id="restart">NEUES SPIEL</button><div class="help">WASD / Pfeiltasten = Laufen · SHIFT = Sprint · E = Spieler wechseln · Q = Pass · LEERTASTE = Schuss<br>Gelber Ring = dein aktuell gesteuerter Spieler.</div></div><script>
const c=document.getElementById('c'),x=c.getContext('2d'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time');
const W=c.width,H=c.height,keys={}; let blueScore=0,redScore=0,time=180,last=performance.now(),selected=0,ended=false,kickLock=0;
const blue=[mk(250,180,'#55aaff'),mk(250,300,'#55aaff'),mk(250,420,'#55aaff')],red=[mk(750,180,'#ff5964'),mk(750,300,'#ff5964'),mk(750,420,'#ff5964')];
let ball={x:500,y:300,vx:0,vy:0,r:11};
function mk(px,py,col){return{x:px,y:py,vx:0,vy:0,r:20,col,speed:155}}
addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code))e.preventDefault();keys[e.code]=true;if(e.code==='KeyE'&&!e.repeat)selected=(selected+1)%3;if(e.code==='KeyQ'&&!e.repeat)kick('pass');if(e.code==='Space'&&!e.repeat)kick('shot')});addEventListener('keyup',e=>keys[e.code]=false);
document.getElementById('restart').onclick=reset;
function reset(){blueScore=redScore=0;time=180;ended=false;selected=0;blue.forEach((p,i)=>{p.x=250;p.y=180+i*120});red.forEach((p,i)=>{p.x=750;p.y=180+i*120});centerBall();}
function centerBall(){ball.x=500;ball.y=300;ball.vx=ball.vy=0;blue.forEach((p,i)=>{p.x=250;p.y=180+i*120});red.forEach((p,i)=>{p.x=750;p.y=180+i*120})}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function kick(type){if(ended||kickLock>0)return;let p=blue[selected];if(dist(p,ball)>55)return;kickLock=.18;if(type==='shot'){let dx=970-ball.x,dy=300-ball.y,l=Math.hypot(dx,dy)||1;ball.vx=dx/l*560;ball.vy=dy/l*560}else{let mates=blue.filter(q=>q!==p).sort((a,b)=>dist(a,ball)-dist(b,ball));let q=mates[0],dx=q.x-ball.x,dy=q.y-ball.y,l=Math.hypot(dx,dy)||1;ball.vx=dx/l*390;ball.vy=dy/l*390}}
function move(p,dx,dy,spd,dt){let l=Math.hypot(dx,dy);if(l){p.x+=dx/l*spd*dt;p.y+=dy/l*spd*dt}p.x=Math.max(45,Math.min(W-45,p.x));p.y=Math.max(45,Math.min(H-45,p.y))}
function update(dt){if(ended)return;kickLock=Math.max(0,kickLock-dt);time-=dt;if(time<=0){time=0;ended=true}
let p=blue[selected],dx=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0),dy=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0);move(p,dx,dy,p.speed*(keys.ShiftLeft||keys.ShiftRight?1.55:1),dt);
blue.forEach((q,i)=>{if(i===selected)return;let target= i===1?ball:{x:ball.x-100,y:ball.y+(i===0?-120:120)};move(q,target.x-q.x,target.y-q.y,105,dt)});
red.forEach((q,i)=>{let target=i===1?ball:{x:ball.x+100,y:ball.y+(i===0?-120:120)};move(q,target.x-q.x,target.y-q.y,118,dt);if(dist(q,ball)<q.r+ball.r+7){let dx=ball.x-q.x,dy=ball.y-q.y,l=Math.hypot(dx,dy)||1;ball.vx=dx/l*330-90;ball.vy=dy/l*330}});
[...blue,...red].forEach(q=>{let d=dist(q,ball),min=q.r+ball.r;if(d<min){let dx=ball.x-q.x,dy=ball.y-q.y,l=d||1;ball.x=q.x+dx/l*min;ball.y=q.y+dy/l*min;ball.vx+=dx/l*65;ball.vy+=dy/l*65}});
ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=Math.pow(.22,dt);ball.vy*=Math.pow(.22,dt);
if(ball.y<ball.r+20){ball.y=ball.r+20;ball.vy=Math.abs(ball.vy)}if(ball.y>H-ball.r-20){ball.y=H-ball.r-20;ball.vy=-Math.abs(ball.vy)}
const inGoal=ball.y>225&&ball.y<375;if(ball.x<12&&inGoal){redScore++;centerBall()}else if(ball.x>W-12&&inGoal){blueScore++;centerBall()}else{if(ball.x<ball.r+20){ball.x=ball.r+20;ball.vx=Math.abs(ball.vx)}if(ball.x>W-ball.r-20){ball.x=W-ball.r-20;ball.vx=-Math.abs(ball.vx)}}
}
function field(){x.clearRect(0,0,W,H);x.fillStyle='#278b47';x.fillRect(0,0,W,H);for(let i=0;i<10;i++){x.fillStyle=i%2?'#278b47':'#2f9650';x.fillRect(i*100,0,100,H)}x.strokeStyle='#fff';x.lineWidth=5;x.strokeRect(22,22,W-44,H-44);x.beginPath();x.moveTo(W/2,22);x.lineTo(W/2,H-22);x.stroke();x.beginPath();x.arc(W/2,H/2,75,0,Math.PI*2);x.stroke();x.strokeRect(22,170,125,260);x.strokeRect(W-147,170,125,260);x.fillStyle='#ddd';x.fillRect(0,225,22,150);x.fillRect(W-22,225,22,150)}
function drawP(p,label,sel){x.beginPath();x.arc(p.x,p.y,p.r,0,Math.PI*2);x.fillStyle=p.col;x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();if(sel){x.beginPath();x.arc(p.x,p.y,p.r+9,0,Math.PI*2);x.strokeStyle='#ffe74c';x.lineWidth=5;x.stroke()}x.fillStyle='#fff';x.font='bold 15px Arial';x.textAlign='center';x.fillText(label,p.x,p.y+5)}
function draw(){field();blue.forEach((p,i)=>drawP(p,''+(i+1),i===selected));red.forEach((p,i)=>drawP(p,''+(i+1),false));x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fillStyle='#fff';x.fill();x.strokeStyle='#111';x.lineWidth=3;x.stroke();if(ended){x.fillStyle='#000b';x.fillRect(250,225,500,150);x.fillStyle='#fff';x.font='bold 38px Arial';x.textAlign='center';x.fillText(blueScore===redScore?'UNENTSCHIEDEN':blueScore>redScore?'ROUTE 69 GEWINNT!':'MATOSVILLE GEWINNT!',500,300);x.font='20px Arial';x.fillText('Neues Spiel klicken für eine weitere Runde',500,340)}scoreEl.textContent=`ROUTE 69 ${blueScore} : ${redScore} MATOSVILLE`;let m=Math.floor(time/60),s=Math.floor(time%60);timeEl.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function loop(t){let dt=Math.min(.03,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
