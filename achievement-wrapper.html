<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matosville Game</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0;background:#080808}body{overflow:hidden}iframe{display:block}</style></head><body><iframe id="g" allow="autoplay; fullscreen"></iframe><script>
const game=new URLSearchParams(location.search).get('game')||'';
const allowed=['trucker-run.html','kirwaspass-in-matosville.html','matosville-zombie-story-ENDVERSION-FIX.html','escape-from-the-wolf.html'];
if(!allowed.includes(game)){document.body.innerHTML='<h1 style="color:white;font-family:Arial">Spiel nicht gefunden</h1>';throw Error('bad game')}

const COMMON=`
const ACH_KEY='truckerLoehnhardProgressV1';
function __ach(id,label,secret=false){let x;try{x=JSON.parse(localStorage.getItem(ACH_KEY))||{badges:{},stats:{}}}catch(e){x={badges:{},stats:{}}}x.badges=x.badges||{};if(x.badges[id])return false;x.badges[id]=true;localStorage.setItem(ACH_KEY,JSON.stringify(x));let t=document.getElementById('__achToast');if(!t){t=document.createElement('div');t.id='__achToast';t.style.cssText='position:fixed;left:50%;bottom:22px;transform:translate(-50%,140px);z-index:2147483647;background:#17110d;color:#fff;border:4px solid #ffd15a;border-radius:14px;padding:13px 22px;box-shadow:0 10px 35px #000b;text-align:center;opacity:0;transition:.4s;pointer-events:none;font:900 16px Arial';document.body.appendChild(t)}t.style.borderColor=secret?'#b66cff':'#ffd15a';t.style.background=secret?'#241331':'#17110d';t.innerHTML='<b style="display:block;color:'+(secret?'#d7b8ff':'#ffd15a')+'">'+(secret?'✦ GEHEIMES ABZEICHEN ENTDECKT ✦':'🏆 ABZEICHEN FREIGESCHALTET!')+'</b><span>'+label+'</span>';requestAnimationFrame(()=>{t.style.transform='translate(-50%,0)';t.style.opacity=1});setTimeout(()=>{t.style.transform='translate(-50%,140px)';t.style.opacity=0},4200);return true}
`;
const scripts={
'trucker-run.html':`
let __oldHit=hitPlayer;hitPlayer=function(obj,now){if(obj&&!obj.hit&&obj.type==='beer'){let x;try{x=JSON.parse(localStorage.getItem(ACH_KEY))||{badges:{},stats:{}}}catch(e){x={badges:{},stats:{}}}x.stats=x.stats||{};x.stats.truckerBeers=(x.stats.truckerBeers||0)+1;localStorage.setItem(ACH_KEY,JSON.stringify(x));__ach('tr_firstbeer','🍺 ERSTES KÜHLES');if(x.stats.truckerBeers>=100)__ach('bierkoenig','🍻 BIERKÖNIG')}if(obj&&!obj.hit&&obj.type==='nacho')__ach('tr_nacho','🧀 NACHO-NOTFALL');let before=beers;__oldHit(obj,now);if(beers>=20&&before<20)__ach('tr_drunk','🥴 20 BIER SPÄTER')};
let __oldUpdate=update;update=function(dt,now){__oldUpdate(dt,now);if(score>=5000)__ach('tr_score5000','🚛 ROUTE-69-PROFI');if(score>=10000)__ach('tr_survivor','❤️ FERNFAHRER');const px=laneCenters[player.lane]-player.width/2;for(const o of objects){if(o.type!=='beer'||o.hit||o.__near)continue;const ox=laneCenters[o.lane]-o.width/2;if(o.y+o.height>=player.y&&o.y<=player.y+player.height){const overlap=px<ox+o.width&&px+player.width>ox;const gap=Math.max(0,Math.max(px,ox)-Math.min(px+player.width,ox+o.width));if(!overlap&&gap<=18){o.__near=true;__ach('secret_knappesbier','🍺 DAS WAR DOCH NOCH GUT!',true)}}}};
`,
'kirwaspass-in-matosville.html':`
let __oldFinishBuff=finishBuffRace;finishBuffRace=function(order){const place=order.indexOf(buffSelected)+1;__oldFinishBuff(order);if(place===1)__ach('bueffelreiter','🐃 BÜFFELREITER');if(place===5)__ach('secret_letzterbueffel','🐃 ICH DACHTE, DER KANN DAS',true)};
let __oldBuy=buyShopItem;buyShopItem=function(item){const had=shopOwned.has(item.id);__oldBuy(item);if(!had&&shopOwned.has(item.id))__ach('kirwa_shop','🛍️ SOUVENIRJÄGER')};
let __oldArm=winArmMatch;winArmMatch=function(){const final=armLevel===4;__oldArm();if(final)__ach('kirwa_arm','💪 STARKER ARM')};
let __oldShoot=handleShootHit;handleShootHit=function(t){__oldShoot(t);if(shootScore>=100)__ach('scharfschuetze','🎯 SCHARFSCHÜTZE')};
setInterval(()=>{if(typeof canDown!=='undefined'&&canDown>=10)__ach('kirwa_cans','🥫 ABGERÄUMT!');if(typeof coins!=='undefined'&&coins>=1000)__ach('kirwa_rich','🎟️ TALER-SAMMLER');const r=document.getElementById('luckResult');if(r&&r.textContent.includes('10.000 KIRWA-TALER'))__ach('kirwa_wheel','🎡 HAUPTGEWINN')},250);
`,
'escape-from-the-wolf.html':`
setInterval(()=>{try{if(forestSave&&forestSave.parts&&['battery','belt','plugs','fuel','hose'].every(k=>forestSave.parts[k]))__ach('escape_parts','🔧 MECHANIKER')}catch(e){}},300);
`,
'matosville-zombie-story-ENDVERSION-FIX.html':`

`
};
f.addEventListener('load',()=>{try{f.contentWindow.eval(COMMON+(scripts[game]||''))}catch(e){console.error('Achievement bridge:',e)}});
</script></body></html>
