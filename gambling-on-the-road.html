<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>GAMBLING ON THE ROAD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090605;font-family:Arial,sans-serif;color:#fff}body{display:flex;align-items:center;justify-content:center}.game{width:min(100vw,calc(100vh * 1.55));height:min(100vh,calc(100vw / 1.55));padding:1.2%;background:radial-gradient(circle at 50% 8%,#5a210e,#1b0c07 55%,#060403);border:5px solid #9e5d22;display:grid;grid-template-rows:auto auto 1fr auto;gap:1%;overflow:hidden}.top h1{margin:0;text-align:center;font-size:clamp(24px,4.6vh,58px);line-height:.9;color:#ffc13b;text-shadow:0 3px #8b2100,0 0 14px #ff7100}.sub{text-align:center;font-weight:900;font-size:clamp(9px,1.5vh,16px);letter-spacing:.18em;margin-top:.5%}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1%}.box{background:#080706;border:2px solid #a76625;border-radius:12px;padding:.45vh;text-align:center;font-weight:900;font-size:clamp(9px,1.3vh,14px)}.box b{display:block;color:#ffd44e;font-size:clamp(18px,3.3vh,34px)}.main{min-height:0;display:grid;grid-template-columns:2.35fr 1fr;gap:1%;align-items:stretch}.reels{min-height:0;display:grid;grid-template-columns:repeat(3,1fr);gap:.7%;background:#160f0b;padding:.7%;border:4px solid #b77a35;border-radius:15px}.reel{min-height:0;display:grid;grid-template-rows:repeat(3,1fr);background:#efe4ce;border:2px solid #38281d;border-radius:10px;overflow:hidden}.cell{min-height:0;position:relative;display:flex;align-items:center;justify-content:center;border-bottom:1px solid #a98e69;background:linear-gradient(#fff9e9,#e8dbc2);overflow:hidden}.cell:last-child{border:0}.cell.mid{background:#fff0b8;box-shadow:inset 0 0 18px #ffbf0050}.cell.match{animation:glow .25s 6 alternate}@keyframes glow{to{background:#ffe663;box-shadow:inset 0 0 25px #ffad00}}.sym-img{max-width:82%;max-height:82%;object-fit:contain;filter:drop-shadow(0 2px 2px #0004)}.sym-emoji{font-size:clamp(30px,7vh,72px);line-height:1}.paytable{min-height:0;background:#0a0705;border:3px solid #96622d;border-radius:14px;padding:2.2%;display:flex;flex-direction:column;justify-content:space-between}.paytable h2{margin:0 0 1%;text-align:center;font-size:clamp(13px,2.3vh,24px);color:#f6c75d}.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4%;border-bottom:1px solid #5b402a;padding:.35vh 0;font-weight:1000;font-size:clamp(9px,1.55vh,16px)}.row:last-child{border:0}.icons{display:flex;align-items:center;gap:2px;min-width:0}.icons img{width:28%;max-height:4vh;object-fit:contain}.icons .e{font-size:clamp(14px,2.8vh,28px)}.val{color:#ffd84c}.neg{color:#ff5a5a}.joker-note{font-size:clamp(7px,1.08vh,11px);line-height:1.15;color:#eedab4;text-align:center;padding-top:.4vh}.bottom{display:grid;grid-template-columns:1fr auto 1fr;gap:1%;align-items:center}.msg{text-align:center;font-size:clamp(11px,1.8vh,20px);font-weight:1000;color:#ffe36d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.controls{display:flex;gap:.5vw;justify-content:center;align-items:center}button{border:2px solid #ffe18b;border-radius:13px;padding:.75vh 1.2vw;font-weight:1000;font-size:clamp(11px,1.8vh,18px);cursor:pointer;background:linear-gradient(#ff542f,#a80c00);color:#fff}#spin{font-size:clamp(18px,3vh,34px);padding:.75vh 3vw;background:linear-gradient(#ff39ef,#8b00a8);box-shadow:0 0 18px #ff3cf36e}button:disabled{filter:grayscale(1);opacity:.55}.bottom-spacer{text-align:right;font-size:clamp(8px,1.1vh,11px);opacity:.65}@media(max-aspect-ratio:1/1){.game{width:100vw;height:100vh;border-width:3px;padding:1.4%;grid-template-rows:auto auto 1fr auto}.main{grid-template-columns:1.9fr 1fr}.paytable{padding:1.6%}.bottom{grid-template-columns:1fr}.bottom-spacer{display:none}.msg{order:2}.controls{order:1}}
</style></head><body>
<div class="game"><div class="top"><h1>GAMBLING ON THE ROAD</h1><div class="sub">TRUCKER LÖNHARD · ROUTE 69</div></div><div class="stats"><div class="box">MÜNZEN<b id="coins">20</b></div><div class="box">EINSATZ<b>1</b></div><div class="box">LETZTER GEWINN<b id="last">0</b></div></div><div class="main"><div class="reels" id="reels"></div><aside class="paytable"><h2>GEWINNTABELLE</h2><div class="row"><div class="icons"><span class="e">🚛🚛🚛</span></div><div class="val">100</div></div><div class="row"><div class="icons"><img src="el-viko.png"><img src="el-viko.png"><img src="el-viko.png"></div><div class="val">60</div></div><div class="row"><div class="icons"><img src="ghettoqueens.png"><img src="ghettoqueens.png"><img src="ghettoqueens.png"></div><div class="val">50</div></div><div class="row"><div class="icons"><span class="e">🥫🥫🥫</span></div><div class="val">20</div></div><div class="row"><div class="icons"><img src="schlange.png"><img src="schlange.png"><img src="schlange.png"></div><div class="val">10</div></div><div class="row"><div class="icons"><img src="trucker-loenhard.png"><img src="trucker-loenhard.png"><img src="trucker-loenhard.png"></div><div class="val">5</div></div><div class="row"><div class="icons"><span class="e">⭐⭐⭐</span></div><div class="val">1</div></div><div class="row"><div class="icons"><img src="wolf.png"><img src="wolf.png"><img src="wolf.png"></div><div class="neg">−5</div></div><div class="row"><div class="icons"><span class="e">🌑🌑🌑</span></div><div class="neg">ALLES WEG!</div></div><div class="joker-note">🃏 JOKER: Direkt-Jackpot · nächster Gewinn ×2 · Werwolf-Schutz</div></aside></div><div class="bottom"><div class="msg" id="msg">VIEL GLÜCK, DIGGI!</div><div class="controls"><button id="music">♫ MUSIK AN</button><button id="spin">SPIN</button><button id="restart">NEUSTART</button></div><div class="bottom-spacer">Drei gleiche Symbole in der mittleren Reihe gewinnen.</div></div></div>
<script>
const symbols=[{id:'star',v:1,w:21,e:'⭐'},{id:'loenhard',v:5,w:19,img:'trucker-loenhard.png'},{id:'snake',v:10,w:14,img:'schlange.png'},{id:'can',v:20,w:12,e:'🥫'},{id:'ghetto',v:50,w:8,img:'ghettoqueens.png'},{id:'elviko',v:60,w:7,img:'el-viko.png'},{id:'jackpot',v:100,w:4,e:'🚛'},{id:'wolf',v:-5,w:8,img:'wolf.png'},{id:'werwolf',v:-999,w:3,e:'🌑'},{id:'joker',v:0,w:5,e:'🃏'}];let coins=20,busy=false,doubleNext=false,shield=false,audio=null,musicOn=false;const $=x=>document.getElementById(x),sleep=m=>new Promise(r=>setTimeout(r,m));function pick(){let t=symbols.reduce((n,s)=>n+s.w,0),r=Math.random()*t;for(const s of symbols){r-=s.w;if(r<=0)return s}return symbols[0]}function node(s){if(s.img){let i=document.createElement('img');i.className='sym-img';i.src=s.img;i.alt=s.id;return i}let x=document.createElement('span');x.className='sym-emoji';x.textContent=s.e;return x}function draw(mids=null){$('reels').innerHTML='';for(let c=0;c<3;c++){let reel=document.createElement('div');reel.className='reel';let arr=[pick(),mids?mids[c]:pick(),pick()];arr.forEach((s,i)=>{let d=document.createElement('div');d.className='cell'+(i===1?' mid':'');d.appendChild(node(s));reel.appendChild(d)});$('reels').appendChild(reel)}}function ui(){coins=Math.max(0,Math.floor(coins));$('coins').textContent=coins;$('spin').disabled=busy||coins<1;if(coins<1&&!busy)$('msg').textContent='GAME OVER – NEUSTART DRÜCKEN'}function setwin(n,text){$('last').textContent=n>0?'+'+n:n;$('msg').textContent=text}async function spin(){if(busy||coins<1)return;busy=true;coins--;setwin(0,'DIE WALZEN DREHEN...');ui();for(let i=0;i<13;i++){draw();await sleep(55)}let m=[pick(),pick(),pick()];draw(m);let same=m[0].id===m[1].id&&m[1].id===m[2].id;if(same){document.querySelectorAll('.mid').forEach(x=>x.classList.add('match'));let s=m[0],k=s.id;if(k==='joker'){let r=Math.floor(Math.random()*3);if(r===0){coins+=100;setwin(100,'JOKER-JACKPOT!')}else if(r===1){doubleNext=true;setwin(0,'JOKER: NÄCHSTER GEWINN ×2')}else{shield=true;setwin(0,'JOKER: WERWOLF-SCHUTZ')}}else if(k==='werwolf'){if(shield){shield=false;setwin(0,'WERWOLF ABGEWEHRT!')}else{let l=coins;coins=0;setwin(-l,'WERWOLF – ALLES WEG!')}}else if(k==='wolf'){let l=Math.min(5,coins);coins-=l;setwin(-l,'WOLF! '+l+' MÜNZEN VERLOREN')}else{let n=s.v;if(doubleNext){n*=2;doubleNext=false}coins+=n;setwin(n,'GEWONNEN: +'+n+' MÜNZEN!')}}else setwin(0,'KNAPP DANEBEN – NOCHMAL!');busy=false;ui()}$('spin').onclick=spin;$('restart').onclick=()=>{coins=20;busy=false;doubleNext=false;shield=false;setwin(0,'VIEL GLÜCK, DIGGI!');draw();ui()};$('music').onclick=()=>{if(!audio){audio=new Audio('gambling-on-the-road-music.mp3');audio.loop=true;audio.volume=.4}if(musicOn){audio.pause();musicOn=false;$('music').textContent='♫ MUSIK AN'}else{audio.play().then(()=>{musicOn=true;$('music').textContent='♫ MUSIK AUS'}).catch(()=>{$('msg').textContent='MUSIKDATEI NICHT VERFÜGBAR'})}};draw();ui();
</script></body></html>
