<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>GAMBLING ON THE ROAD</title>
<style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 10%,#51200f,#100807 58%,#050303);font-family:Arial,sans-serif;color:#fff}body{display:flex;align-items:center;justify-content:center;padding:12px}.game{width:min(980px,100%);background:linear-gradient(145deg,#3a2418,#0b0908);border:6px solid #a96727;border-radius:28px;box-shadow:0 0 40px #ff8a0038,inset 0 0 30px #000;padding:18px}.title{text-align:center;font-size:clamp(34px,7vw,78px);font-weight:1000;color:#ffc43d;text-shadow:0 4px #8e1d00,0 0 16px #ff6500;line-height:.9}.sub{text-align:center;font-weight:900;letter-spacing:.18em;margin:8px 0 18px}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}.box{background:#080706;border:3px solid #a96727;border-radius:15px;padding:10px;text-align:center;font-weight:900}.box b{display:block;color:#ffd35a;font-size:clamp(20px,4vw,36px)}.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:#17100c;padding:12px;border:5px solid #c88b42;border-radius:20px}.reel{background:linear-gradient(#fff8e9,#e5d6bc);border-radius:12px;overflow:hidden;border:3px solid #38281d}.cell{height:clamp(100px,18vw,180px);display:flex;align-items:center;justify-content:center;border-bottom:2px solid #a58e6b;color:#1b130e;font-size:clamp(42px,9vw,90px);font-weight:900;text-align:center}.cell:last-child{border:0}.cell.mid{background:#fff0b9;box-shadow:inset 0 0 25px #ffb70066}.cell.match{animation:glow .25s 6 alternate}@keyframes glow{to{background:#ffe45e;transform:scale(.97)}}.controls{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:16px}button{border:3px solid #ffe595;border-radius:16px;padding:12px 22px;font-weight:1000;font-size:20px;cursor:pointer;background:linear-gradient(#ff542f,#a80c00);color:#fff}#spin{font-size:clamp(28px,5vw,48px);padding:10px 55px;background:linear-gradient(#ff38ef,#8e00a8);box-shadow:0 0 20px #ff3cf388}button:disabled{filter:grayscale(1);opacity:.6}.pay{margin-top:15px;background:#0b0907;border:3px solid #77502c;border-radius:16px;padding:10px;text-align:center;font-weight:800;line-height:1.6;color:#f5dfb0}.msg{text-align:center;min-height:46px;margin:12px 0 0;font-size:clamp(20px,4vw,34px);font-weight:1000;color:#ffe36c;text-shadow:0 2px #000}.tiny{text-align:center;opacity:.7;margin-top:7px;font-size:12px}@media(max-width:600px){.game{padding:10px}.cell{height:105px}.stats{gap:5px}.box{padding:7px}.controls{gap:7px}button{padding:10px 13px;font-size:16px}#spin{padding:10px 28px}}</style></head><body>
<div class="game"><div class="title">GAMBLING<br>ON THE ROAD</div><div class="sub">TRUCKER LÖNHARD · ROUTE 69</div><div class="stats"><div class="box">MÜNZEN<b id="coins">20</b></div><div class="box">EINSATZ<b>1</b></div><div class="box">LETZTER GEWINN<b id="last">0</b></div></div><div class="reels" id="reels"></div><div class="msg" id="msg">VIEL GLÜCK, DIGGI!</div><div class="controls"><button id="music">♫ MUSIK AN</button><button id="spin">SPIN</button><button id="restart">NEUSTART</button></div><div class="pay">🚛🚛🚛 JACKPOT +100 · 🐃🐃🐃 +60 · 🤠🤠🤠 +50 · 🥫🥫🥫 +20 · 🐍🐍🐍 +10 · 😁😁😁 +5 · ⭐⭐⭐ +1 · 🐺🐺🐺 −5<br>🃏🃏🃏 JOKER: +100 / nächster Gewinn ×2 / Werwolf-Schutz</div><div class="tiny">Drei gleiche Symbole in der mittleren Reihe gewinnen.</div></div>
<script>const symbols=[['⭐','star',1,21],['😁','loenhard',5,19],['🐍','snake',10,14],['🥫','can',20,12],['🤠','ghetto',50,8],['🐃','elviko',60,7],['🚛','jackpot',100,4],['🐺','wolf',-5,8],['🌑','werwolf',-999,3],['🃏','joker',0,5]];let coins=20,busy=false,doubleNext=false,shield=false,audio=null,musicOn=false;const $=x=>document.getElementById(x),sleep=m=>new Promise(r=>setTimeout(r,m));function pick(){let t=symbols.reduce((n,s)=>n+s[3],0),r=Math.random()*t;for(const s of symbols){r-=s[3];if(r<=0)return s}return symbols[0]}function draw(mids=null){$('reels').innerHTML='';for(let c=0;c<3;c++){let reel=document.createElement('div');reel.className='reel';let arr=[pick(),mids?mids[c]:pick(),pick()];arr.forEach((s,i)=>{let d=document.createElement('div');d.className='cell'+(i===1?' mid':'');d.textContent=s[0];reel.appendChild(d)});$('reels').appendChild(reel)}}function ui(){coins=Math.max(0,Math.floor(coins));$('coins').textContent=coins;$('spin').disabled=busy||coins<1;if(coins<1&&!busy)$('msg').textContent='GAME OVER – NEUSTART DRÜCKEN'}function setwin(n,text){$('last').textContent=n>0?'+'+n:n;$('msg').textContent=text}async function spin(){if(busy||coins<1)return;busy=true;coins--;setwin(0,'DIE WALZEN DREHEN...');ui();for(let i=0;i<15;i++){draw();await sleep(55)}let m=[pick(),pick(),pick()];draw(m);let same=m[0][1]===m[1][1]&&m[1][1]===m[2][1];if(same){document.querySelectorAll('.mid').forEach(x=>x.classList.add('match'));let s=m[0],k=s[1];if(k==='joker'){let r=Math.floor(Math.random()*3);if(r===0){coins+=100;setwin(100,'JOKER-JACKPOT!')}else if(r===1){doubleNext=true;setwin(0,'JOKER: NÄCHSTER GEWINN ×2')}else{shield=true;setwin(0,'JOKER: WERWOLF-SCHUTZ')}}else if(k==='werwolf'){if(shield){shield=false;setwin(0,'WERWOLF ABGEWEHRT!')}else{let l=coins;coins=0;setwin(-l,'WERWOLF – ALLES WEG!')}}else if(k==='wolf'){let l=Math.min(5,coins);coins-=l;setwin(-l,'WOLF! '+l+' MÜNZEN VERLOREN')}else{let n=s[2];if(doubleNext){n*=2;doubleNext=false}coins+=n;setwin(n,'GEWONNEN: +'+n+' MÜNZEN!')}}else setwin(0,'KNAPP DANEBEN – NOCHMAL!');busy=false;ui()}$('spin').onclick=spin;$('restart').onclick=()=>{coins=20;busy=false;doubleNext=false;shield=false;setwin(0,'VIEL GLÜCK, DIGGI!');draw();ui()};$('music').onclick=()=>{try{if(!audio){audio=new Audio('gambling-on-the-road-music.mp3');audio.loop=true;audio.volume=.4}if(musicOn){audio.pause();musicOn=false;$('music').textContent='♫ MUSIK AN'}else{audio.play().then(()=>{musicOn=true;$('music').textContent='♫ MUSIK AUS'}).catch(()=>{$('msg').textContent='MUSIKDATEI NOCH NICHT VERFÜGBAR'})}}catch(e){$('msg').textContent='MUSIKDATEI NOCH NICHT VERFÜGBAR'}};draw();ui();</script></body></html>
