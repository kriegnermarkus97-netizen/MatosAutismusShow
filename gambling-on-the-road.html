<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>GAMBLING ON THE ROAD</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080504;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center}.machine{position:relative;height:min(100vh,150vw);width:min(100vw,66.6667vh);aspect-ratio:2/3;background:url('gambling-overlay.jpg') center/100% 100% no-repeat;overflow:hidden}.reels{position:absolute;left:9.3%;top:27.1%;width:48.2%;height:45.2%;display:grid;grid-template-columns:repeat(3,1fr);gap:1.5%;padding:.5%;border-radius:2%;overflow:hidden}.reel{display:grid;grid-template-rows:repeat(3,1fr);min-height:0;overflow:hidden;border-radius:5%}.cell{display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;background:linear-gradient(#fffaf0,#f0e3c9);border-bottom:1px solid #a98e69;position:relative}.cell.mid{background:#fff1bd}.cell:last-child{border:0}.sprite{width:86%;height:86%;background-image:url('slot-sprite.webp');background-repeat:no-repeat;background-size:500% 200%;filter:drop-shadow(0 2px 2px #0004)}.s-star{background-position:0 0}.s-beer{background-position:25% 0}.s-snake{background-position:50% 0}.s-buffalo{background-position:75% 0}.s-cigarettes{background-position:100% 0}.s-loenhard{background-position:0 100%}.s-truck{background-position:25% 100%}.s-wolf{background-position:50% 100%}.s-werwolf{background-position:75% 100%}.s-joker{background-position:100% 100%}.cell.win{animation:winflash .18s 8 alternate;z-index:3}.cell.win:after{content:'';position:absolute;left:4%;right:4%;top:48%;height:5%;background:#ff2727;box-shadow:0 0 10px #ffef4a;transform:rotate(-4deg);border-radius:10px}@keyframes winflash{to{background:#ffe34d;filter:brightness(1.35);box-shadow:inset 0 0 22px #ff6a00}}.num{position:absolute;top:18.5%;width:24%;height:5.2%;display:flex;align-items:flex-end;justify-content:center;color:#ffd744;font-weight:1000;font-size:clamp(20px,4.2vh,48px);text-shadow:0 2px #000}.coins{left:13.3%}.bet{left:38%}.last{left:62.8%}.hot{position:absolute;border:0;background:transparent;cursor:pointer;color:transparent}.hot:disabled{cursor:not-allowed}.music{left:18.5%;top:79.2%;width:21%;height:7.2%}.spin{left:41%;top:78.4%;width:18%;height:8.5%}.restart{left:61%;top:79.2%;width:21%;height:7.2%}.msg{position:absolute;left:18%;top:74.2%;width:40%;height:3%;display:flex;align-items:center;justify-content:center;text-align:center;color:#ffe36d;font-weight:1000;font-size:clamp(8px,1.45vh,16px);text-shadow:0 1px 3px #000;overflow:hidden}.fallback{position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 10%,#6c2b12,#160b07 60%,#050303)}@media(max-width:600px){.msg{font-size:clamp(7px,2vw,12px)}}</style></head><body><div class="machine"><div class="fallback"></div><div class="num coins" id="coins">20</div><div class="num bet">1</div><div class="num last" id="last">0</div><div class="reels" id="reels"></div><div class="msg" id="msg">VIEL GLÜCK, DIGGI!</div><button class="hot music" id="music" aria-label="Musik an oder aus">MUSIK</button><button class="hot spin" id="spin" aria-label="Spin">SPIN</button><button class="hot restart" id="restart" aria-label="Neustart">NEUSTART</button></div><script>const symbols=[{id:'star',v:1,w:21},{id:'beer',v:5,w:19},{id:'snake',v:10,w:14},{id:'buffalo',v:20,w:12},{id:'cigarettes',v:50,w:8},{id:'loenhard',v:60,w:7},{id:'truck',v:100,w:4},{id:'wolf',v:-5,w:8},{id:'werwolf',v:-999,w:3},{id:'joker',v:0,w:5}];let coins=20,busy=false,doubleNext=false,shield=false,audio=null,musicOn=false;const $=x=>document.getElementById(x),sleep=m=>new Promise(r=>setTimeout(r,m));function pick(){let t=symbols.reduce((n,s)=>n+s.w,0),r=Math.random()*t;for(const s of symbols){r-=s.w;if(r<=0)return s}return symbols[0]}function node(s){let x=document.createElement('span');x.className='sprite s-'+s.id;x.setAttribute('aria-label',s.id);return x}function draw(mids=null){$('reels').innerHTML='';for(let c=0;c<3;c++){let reel=document.createElement('div');reel.className='reel';let arr=[pick(),mids?mids[c]:pick(),pick()];arr.forEach((s,i)=>{let d=document.createElement('div');d.className='cell'+(i===1?' mid':'');d.appendChild(node(s));reel.appendChild(d)});$('reels').appendChild(reel)}}function ui(){coins=Math.max(0,Math.floor(coins));$('coins').textContent=coins;$('spin').disabled=busy||coins<1;if(coins<1&&!busy)$('msg').textContent='GAME OVER – NEUSTART'}function setwin(n,text){$('last').textContent=n>0?'+'+n:n;$('msg').textContent=text}async function spin(){if(busy||coins<1)return;busy=true;coins--;setwin(0,'DIE WALZEN DREHEN...');ui();for(let i=0;i<13;i++){draw();await sleep(55)}let m=[pick(),pick(),pick()];draw(m);let same=m[0].id===m[1].id&&m[1].id===m[2].id;if(same){document.querySelectorAll('.mid').forEach(x=>x.classList.add('win'));let s=m[0],k=s.id;if(k==='joker'){let r=Math.floor(Math.random()*3);if(r===0){coins+=100;setwin(100,'JOKER-JACKPOT!')}else if(r===1){doubleNext=true;setwin(0,'JOKER: NÄCHSTER GEWINN ×2')}else{shield=true;setwin(0,'JOKER: WERWOLF-SCHUTZ')}}else if(k==='werwolf'){if(shield){shield=false;setwin(0,'WERWOLF ABGEWEHRT!')}else{let l=coins;coins=0;setwin(-l,'WERWOLF – ALLES WEG!')}}else if(k==='wolf'){let l=Math.min(5,coins);coins-=l;setwin(-l,'WOLF! '+l+' MÜNZEN VERLOREN')}else{let n=s.v;if(doubleNext){n*=2;doubleNext=false}coins+=n;setwin(n,'GEWONNEN: +'+n+' MÜNZEN!')}}else setwin(0,'KNAPP DANEBEN – NOCHMAL!');busy=false;ui()}$('spin').onclick=spin;$('restart').onclick=()=>{coins=20;busy=false;doubleNext=false;shield=false;setwin(0,'VIEL GLÜCK, DIGGI!');draw();ui()};$('music').onclick=()=>{if(!audio){audio=new Audio('mariachi.mp3');audio.loop=true;audio.preload='auto';audio.volume=.4}if(musicOn){audio.pause();musicOn=false}else{audio.play().then(()=>musicOn=true).catch(()=>$('msg').textContent='MUSIKDATEI NICHT VERFÜGBAR')}};draw();ui();</script></body></html>
