ox-shadow:inset 0 0 22px #ff6a00}}.wallet{position:absolute;left:7.2%;top:16.7%;width:51.2%;height:7.6%;z-index:15;background:#000;border:3px solid #d18a43;border-radius:12px;box-shadow:inset 0 0 0 2px #3d281c,0 0 8px #000;display:flex;align-items:center;justify-content:center;gap:8%;padding:0 3%;color:#fff}.wallet-label{font-weight:1000;font-size:clamp(10px,1.75vh,19px);letter-spacing:.06em;white-space:nowrap}.coins{color:#ffd744;font-weight:1000;font-size:clamp(22px,4.4vh,50px);line-height:1;text-shadow:0 2px #000;min-width:28%;text-align:center}.hot{position:absolute;border:0;background:transparent;cursor:pointer;color:transparent}.hot:disabled{cursor:not-allowed}.spin{left:41%;top:78.4%;width:18%;height:8.5%}.restart{left:61%;top:79.2%;width:21%;height:7.2%}.result{position:absolute;left:12%;top:44%;width:43%;min-height:11%;display:none;z-index:20;align-items:center;justify-content:center;text-align:center;padding:1.4% 2%;border:4px solid #ffab16;border-radius:14px;background:linear-gradient(#372013,#140b08);box-shadow:0 0 0 3px #4b250e,0 0 22px #ff7a00;color:#ffe35b;font-weight:1000;font-size:clamp(18px,3.4vh,40px);line-height:1.05;text-shadow:0 3px 0 #5c1400}.result.show{display:flex;animation:pop .18s ease-out}.result.bad{color:#ff5b54;border-color:#b00;box-shadow:0 0 0 3px #4b0d0d,0 0 22px #d00}.result.special{color:#e7b7ff;border-color:#9a47e5;box-shadow:0 0 0 3px #3b164f,0 0 22px #b24cff}@keyframes pop{from{transform:scale(.72);opacity:0}to{transform:scale(1);opacity:1}}.fallback{position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 50% 10%,#6c2b12,#160b07 60%,#050303)}@media(max-width:600px){.result{font-size:clamp(15px,4vw,26px);border-width:3px}.wallet{border-width:2px}}</style></head><body><div class="machine"><div class="fallback"></div><div class="wallet"><span class="wallet-label">MÜNZEN</span><span class="coins" id="coins">20</span></div><div class="reels" id="reels"></div><div class="result" id="result"></div><button class="hot i(){coins=Math.max(0,Math.floor(coins));$('coins').textContent=coins;$('spin').disabled=busy||coins<1;if(coins<1&&!busy)showResult('GAME OVER','bad',true)}async function spin(){if(busy||coins<1)return;busy=true;hideResult();coins--;ui();for(let i=0;i<13;i++){draw();await sleep(55)}let m=[pick(),pick(),pick()];draw(m);let same=m[0].id===m[1].id&&m[1].id===m[2].id;if(same){document.querySelectorAll('.mid').forEach(x=>x.classList.add('win'));let s=m[0],k=s.id;if(k==='joker'){let r=Math.floor(Math.random()*3);if(r===0){coins+=100;showResult('JOKER! +100','special')}else if(r===1){doubleNext=true;showResult('JOKER! NÄCHSTER GEWINN ×2','special')}else{shield=true;showResult('JOKER! WERWOLF-SCHUTZ','special')}}else if(k==='werwolf'){if(shield){shield=false;showResult('WERWOLF ABGEWEHRT!','special')}else{let l=coins;coins=0;showResult('ALLES WEG!','bad',true)}}else if(k==='wolf'){let l=Math.min(5,coins);coins-=l;showResult('WOLF! -'+l,'bad')}else{let n=s.v;if(doubleNext){n*=2;doubleNext=false}coins+=n;showResult('GEWINN! +'+n,'good')}}busy=false;ui()}$('spin').onclick=spin;$('restart').onclick=()=>{coins=20;busy=false;doubleNext=false;shield=false;hideResult();draw();ui()};draw();ui();</script></body></html>
