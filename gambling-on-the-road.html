<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>GAMBLING ON THE ROAD</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#090706;overflow:hidden;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center}#game{position:relative;width:min(100vw,calc(100vh * 1374 / 1145));aspect-ratio:1374/1145;background:url("gambling-on-the-road-bg.jpg") center/100% 100% no-repeat;overflow:hidden;user-select:none}.reels{position:absolute;left:17.65%;top:29.95%;width:45.05%;height:44.95%;display:grid;grid-template-columns:repeat(3,1fr);gap:.25%;overflow:hidden;border-radius:1%;z-index:5}.reel{display:grid;grid-template-rows:repeat(3,1fr);overflow:hidden;background:#eee5d2}.cell{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(#f5efe4,#e9dfcf);border-bottom:1px solid #806f5a55}.sym{width:70%;height:70%;background-image:url("gambling-on-the-road-symbols.webp");background-size:300% 300%;background-repeat:no-repeat;filter:drop-shadow(0 3px 2px #0003);transition:.15s}.reel.spinning .sym{animation:blur .09s linear infinite alternate}@keyframes blur{from{transform:translateY(-7%) scale(.96);filter:blur(.8px)}to{transform:translateY(7%) scale(1.03);filter:blur(1.4px)}}.cell.middle:after{content:"";position:absolute;inset:0;border-top:2px solid #ffba2f38;border-bottom:2px solid #ffba2f38}.cell.match{animation:glow .25s ease-in-out 6 alternate}.cell.match .sym{animation:pop .25s ease-in-out 6 alternate}@keyframes glow{to{background:#fff8dc;box-shadow:inset 0 0 38px #ffd43b,0 0 24px #ffd43b}}@keyframes pop{to{transform:scale(1.12);filter:drop-shadow(0 0 14px #ffe35a)}}#payline{position:absolute;left:17.65%;top:52.35%;width:45.05%;z-index:55;opacity:0;pointer-events:none}#payline:before{content:"";display:block;width:0;height:5px;border-radius:20px;background:linear-gradient(90deg,#fff7a8,#ffd52f,#ff7a00,#ffd52f,#fff7a8);box-shadow:0 0 16px #ffb000}#payline.show{opacity:1}#payline.show:before{animation:line .45s ease-out forwards,pulse .28s ease-in-out .45s 3 alternate}@keyframes line{to{width:100%}}@keyframes pulse{to{filter:brightness(1.7);transform:scaleY(1.8)}}#spin{position:absolute;left:31.3%;top:80.2%;width:22.2%;height:10.5%;border:0;border-radius:30px;background:transparent;cursor:pointer;z-index:30}.music-hit{position:absolute;top:84.1%;height:5.4%;border:0;background:transparent;cursor:pointer;z-index:31;border-radius:8px}#musicOn{left:14.7%;width:6.2%}#musicOff{left:21.6%;width:6.6%}.music-hit.active{box-shadow:0 0 0 3px #4eff6ef2,0 0 18px #4eff6ee6}#musicOff.active{box-shadow:0 0 0 3px #ffffffbf,0 0 14px #ffffff8c}#coins{position:absolute;left:61.2%;top:84.2%;width:10.55%;height:5.2%;display:flex;align-items:center;justify-content:center;z-index:25;background:#050505;color:#fff;border-radius:7px;font-weight:900;font-size:clamp(22px,3.6vw,55px);text-shadow:0 2px 2px #000}#win{position:absolute;left:33.8%;top:21.3%;width:31.5%;height:5.1%;display:flex;align-items:center;justify-content:center;z-index:60;border:3px solid #ffd75a;border-radius:999px;background:linear-gradient(#24140afa,#080604fa);color:#fff4a8;font-weight:1000;font-size:clamp(12px,1.65vw,24px);letter-spacing:.055em;text-shadow:0 2px 2px #000,0 0 10px #ffca37bf;box-shadow:0 0 0 2px #782f00bf,0 4px 12px #0009,0 0 18px #ffa40059}.good{animation:banner .35s ease-in-out 4 alternate}@keyframes banner{to{transform:scale(1.06);box-shadow:0 0 28px #ffd43b}}#gameOver{position:absolute;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:#000b}.show{display:flex!important}.card{min-width:42%;padding:3.2% 4%;text-align:center;border:4px solid #ffb32b;border-radius:24px;background:linear-gradient(#26150d,#090706);box-shadow:0 0 38px #ff8100b3}.title{font-size:clamp(34px,6vw,84px);font-weight:1000;color:#ffca37;text-shadow:0 4px 0 #8c2600,0 0 18px #ff5b00}.txt{margin:1em 0;color:#fff;font-weight:800;font-size:clamp(14px,2vw,27px)}#restart{padding:.55em 1.3em;border-radius:16px;border:3px solid #ffe58a;background:linear-gradient(#ff4a20,#bd1000);color:#fff;font-size:clamp(20px,3vw,42px);font-weight:1000;cursor:pointer}
</style></head><body><div id="game"><div class="reels" id="reels"></div><div id="payline"></div><button id="spin" aria-label="Spin"></button><button id="musicOn" class="music-hit" aria-label="Musik an"></button><button id="musicOff" class="music-hit active" aria-label="Musik aus"></button><div id="coins">20</div><div id="win">GEWINN: 0 MÜNZEN</div><div id="gameOver"><div class="card"><div class="title">GAME OVER</div><div class="txt">Keine Münzen mehr, Diggi!</div><button id="restart">RESTART</button></div></div></div>
<script>
const S=[['star',1,21],['loenhard',5,19],['snake',10,14],['can',20,12],['ghetto',50,8],['elviko',60,7],['jackpot',100,4],['wolf',-5,8],['werwolf',-999,3],['joker',0,5]];
const POS={snake:'0% 0%',star:'50% 0%',ghetto:'100% 0%',loenhard:'0% 50%',can:'50% 50%',wolf:'100% 50%',werwolf:'100% 50%',joker:'0% 100%',jackpot:'50% 100%',elviko:'100% 100%'};const $=x=>document.getElementById(x),sleep=m=>new Promise(r=>setTimeout(r,m));let coins=20,busy=false,doubleNext=false,shield=false;const music=new Audio('gambling-on-the-road-music.mp3');music.loop=true;music.volume=.45;
function pick(){let t=S.reduce((a,x)=>a+x[2],0),r=Math.random()*t;for(const x of S){r-=x[2];if(r<=0)return x}return S[0]}function cell(s,mid=false){let c=document.createElement('div');c.className='cell'+(mid?' middle':'');let d=document.createElement('div');d.className='sym';d.style.backgroundPosition=POS[s[0]];c.appendChild(d);return c}function fill(j,m=null){let r=$('r'+j);r.innerHTML='';[pick(),m||pick(),pick()].forEach((s,i)=>r.appendChild(cell(s,i===1)))}function init(){let a=[['snake','loenhard','joker'],['star','can','jackpot'],['ghetto','wolf','elviko']];$('reels').innerHTML='';for(let j=0;j<3;j++){let r=document.createElement('div');r.className='reel';r.id='r'+j;$('reels').appendChild(r);a[j].forEach((k,i)=>r.appendChild(cell(S.find(x=>x[0]===k),i===1)))}}function win(n,l='GEWINN'){let e=$('win');e.textContent=n>0?l+': +'+n+' MÜNZEN':n<0?l+': '+n+' MÜNZEN':'GEWINN: 0 MÜNZEN';e.classList.remove('good');void e.offsetWidth;if(n>0)e.classList.add('good')}function ui(){coins=Math.max(0,Math.floor(coins));$('coins').textContent=coins;$('spin').disabled=busy||coins<1;if(!busy&&coins===0)$('gameOver').classList.add('show')}async function flash(){for(let j=0;j<3;j++)$('r'+j).children[1].classList.add('match');$('payline').classList.remove('show');void $('payline').offsetWidth;$('payline').classList.add('show');await sleep(1400);for(let j=0;j<3;j++)$('r'+j).children[1].classList.remove('match');$('payline').classList.remove('show');await sleep(150)}function joker(){let r=Math.floor(Math.random()*3);if(r===0){coins+=100;win(100,'JOKER-JACKPOT')}else if(r===1){doubleNext=true;$('win').textContent='JOKER: NÄCHSTER GEWINN ×2'}else{shield=true;$('win').textContent='JOKER: WERWOLF-SCHUTZ'}}async function spin(){if(busy||coins<1)return;busy=true;coins--;win(0);ui();for(let j=0;j<3;j++)$('r'+j).classList.add('spinning');for(let k=0;k<18;k++){for(let j=0;j<3;j++)fill(j);await sleep(40+k*3)}let a=[pick(),pick(),pick()];for(let j=0;j<3;j++){fill(j,a[j]);$('r'+j).classList.remove('spinning');await sleep(110)}let three=a[0][0]===a[1][0]&&a[1][0]===a[2][0];if(three){await flash();let s=a[0],k=s[0];if(k==='joker')joker();else if(k==='werwolf'){if(shield){shield=false;$('win').textContent='WERWOLF ABGEWEHRT!'}else{let l=coins;coins=0;win(-l,'VERLOREN')}}else if(k==='wolf'){let l=Math.min(coins,5);coins-=l;win(-l,'VERLOREN')}else{let n=s[1];if(doubleNext){n*=2;doubleNext=false}coins+=n;win(n,'GEWONNEN')}}else win(0);busy=false;ui()}$('spin').onclick=spin;$('musicOn').onclick=async()=>{try{await music.play();$('musicOn').classList.add('active');$('musicOff').classList.remove('active')}catch(e){}};$('musicOff').onclick=()=>{music.pause();$('musicOff').classList.add('active');$('musicOn').classList.remove('active')};$('restart').onclick=()=>{coins=20;busy=false;doubleNext=false;shield=false;$('gameOver').classList.remove('show');win(0);init();ui()};init();ui();
</script></body></html>
