<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>GAMBLING ON THE ROAD</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080504}
body{position:relative;background-image:linear-gradient(#0001,#0001),url('gambling-casino-background.webp');background-size:cover;background-position:center}
.game{position:absolute;inset:0;width:100vw;height:100vh;border:0;display:block;background:transparent}
</style>
</head>
<body>
<iframe id="game" class="game" src="gambling-on-the-road.html?v=full-wide-1" title="Gambling on the Road"></iframe>
<script>
const game=document.getElementById('game');
game.addEventListener('load',()=>{
  try{
    const d=game.contentDocument;
    const style=d.createElement('style');
    style.textContent=`
      html,body{background:transparent!important;width:100%!important;height:100%!important;overflow:hidden!important}
      body{display:flex!important;align-items:center!important;justify-content:center!important}
      @media (min-aspect-ratio:1/1){
        .machine{height:100vh!important;width:min(100vw,108vh)!important;aspect-ratio:auto!important;background-size:100% 100%!important}
      }
      @media (max-aspect-ratio:1/1){
        .machine{height:min(100vh,150vw)!important;width:min(100vw,66.6667vh)!important;aspect-ratio:2/3!important}
      }
    `;
    d.head.appendChild(style);
  }catch(e){console.warn(e)}
});
</script>
</body>
</html>
