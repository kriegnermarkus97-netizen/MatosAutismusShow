<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>GAMBLING ON THE ROAD – FINAL TEST</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#1a0c05;font-family:Arial,sans-serif}body{display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(90deg,#2a1207 0 18%,#120704 18% 82%,#2a1207 82% 100%)}
.side{position:absolute;top:0;bottom:0;width:20%;overflow:hidden;background:repeating-linear-gradient(90deg,#3d1d0b 0 34px,#2b1207 34px 38px,#5a2b10 38px 73px,#321508 73px 78px),linear-gradient(#2a1207,#4a210c 48%,#241006);box-shadow:inset 0 0 45px #000c;z-index:0}.side:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 58px,#0004 59px 61px,transparent 62px 120px);mix-blend-mode:multiply}.left{left:0}.right{right:0}.casino-sign{position:absolute;top:5%;left:8%;right:8%;padding:12px 6px;text-align:center;color:#ffd36b;border:4px solid #c67b23;border-radius:16px;background:#180b06;font-weight:1000;font-size:clamp(18px,2.5vw,42px);letter-spacing:.08em;text-shadow:0 2px #000;box-shadow:0 0 18px #ff9c32aa}.cards{position:absolute;top:27%;left:8%;right:8%;display:flex;gap:8px;justify-content:center;transform:rotate(-5deg)}.card{width:42%;aspect-ratio:2/3;background:#f6ead0;border:4px solid #4b1c0c;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:clamp(30px,4vw,70px);font-weight:900;box-shadow:0 10px 18px #0008}.chips{position:absolute;left:6%;right:6%;bottom:17%;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.chip{width:48px;height:48px;border-radius:50%;border:8px dashed #f6e3bd;background:#8e1616;box-shadow:inset 0 0 0 6px #c83a25,0 5px 8px #0008}.chip:nth-child(2n){background:#144f87}.chip:nth-child(3n){background:#176c35}.dice{position:absolute;bottom:5%;left:12%;right:12%;display:flex;justify-content:space-around;font-size:clamp(40px,5vw,82px);filter:drop-shadow(0 5px 4px #0008)}.badge{position:absolute;top:55%;left:12%;right:12%;padding:9px 5px;text-align:center;color:#fff;background:#7a1b0c;border:3px solid #e1a044;border-radius:50%;font-weight:900;font-size:clamp(12px,1.5vw,24px);transform:rotate(6deg);box-shadow:0 8px 12px #0008}.right .badge{transform:rotate(-7deg);background:#141414}.machine-wrap{position:relative;z-index:2;height:100vh;width:min(80vw,900px);display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 0 18px #000)}.game{height:100vh;width:66.6667vh;max-width:78vw;border:0;display:block;background:#000}
@media(max-width:900px){.side{display:none}.machine-wrap{width:100vw}.game{max-width:100vw}}
</style>
</head>
<body>
<div class="side left"><div class="casino-sign">♠ CASINO ♥</div><div class="cards"><div class="card">A♠</div><div class="card" style="color:#a00">K♥</div></div><div class="badge">ALL IN</div><div class="chips"><i class="chip"></i><i class="chip"></i><i class="chip"></i><i class="chip"></i><i class="chip"></i><i class="chip"></i><i class="chip"></i></div><div class="dice">🎲 🎰</div></div>
<div class="side right"><div class="casino-sign">♦ JACKPOT ♣</div><div class="cards"><div class="card" style="color:#a00">Q♦</div><div class="card">J♣</div></div><div class="badge">LUCKY 69</div><div class="chips"><i class="chip"></i><i class="chip"></i><i class="chip"></i><i class="chip"></i><i class="chip"></i><i class="chip"></i><i class="chip"></i></div><div class="dice">🃏 🎲</div></div>
<div class="machine-wrap"><iframe id="game" class="game" src="gambling-on-the-road.html?v=three-row-test" title="Gambling on the Road"></iframe></div>
<script>
const frame=document.getElementById('game');
frame.addEventListener('load',()=>{
 const d=frame.contentDocument,w=frame.contentWindow;
 const s=d.createElement('script');
 s.textContent=`
 function drawMatrix(matrix){
   $('reels').innerHTML='';
   for(let c=0;c<3;c++){
     let reel=document.createElement('div'); reel.className='reel';
     for(let r=0;r<3;r++){
       let cell=document.createElement('div'); cell.className='cell'+(r===1?' mid':'');
       cell.dataset.row=r; cell.dataset.col=c; cell.appendChild(node(matrix[r][c])); reel.appendChild(cell);
     }
     $('reels').appendChild(reel);
   }
 }
 function randomMatrix(){return [[pick(),pick(),pick()],[pick(),pick(),pick()],[pick(),pick(),pick()]]}
 function flashRow(row){document.querySelectorAll('.cell[data-row="'+row+'"]').forEach(x=>x.classList.add('win'))}
 function resolveNormal(s){let n=s.v;if(doubleNext){n*=2;doubleNext=false}coins+=n;return n}
 spin=async function(){
   if(busy||coins<1)return;
   busy=true; hideResult(); coins--; ui();
   for(let i=0;i<13;i++){drawMatrix(randomMatrix());await sleep(55)}
   const m=randomMatrix(); drawMatrix(m);
   const wins=[];
   for(let r=0;r<3;r++){if(m[r][0].id===m[r][1].id&&m[r][1].id===m[r][2].id)wins.push({row:r,s:m[r][0]})}
   if(wins.length){
     wins.forEach(x=>flashRow(x.row));
     let total=0, messages=[];
     for(const x of wins){
       const s=x.s,k=s.id;
       if(k==='joker'){
         let rr=Math.floor(Math.random()*3);
         if(rr===0){coins+=100;total+=100;messages.push('JOKER +100')}
         else if(rr===1){doubleNext=true;messages.push('JOKER ×2 NÄCHSTER GEWINN')}
         else{shield=true;messages.push('JOKER WERWOLF-SCHUTZ')}
       }else if(k==='werwolf'){
         if(shield){shield=false;messages.push('WERWOLF ABGEWEHRT')}
         else{let lost=coins;coins=0;total-=lost;messages.push('ALLES WEG')}
       }else if(k==='wolf'){
         let lost=Math.min(5,coins);coins-=lost;total-=lost;messages.push('WOLF -'+lost)
       }else{
         let n=resolveNormal(s);total+=n;messages.push('+'+n)
       }
     }
     if(messages.length===1) showResult(messages[0],total<0?'bad':wins[0].s.id==='joker'?'special':'good');
     else showResult(wins.length+' REIHEN! '+(total>0?'+'+total:total<0?total:'')+(messages.some(x=>x.includes('JOKER'))?' · JOKER':''),total<0?'bad':'good');
   }
   busy=false; ui();
 };
 $('spin').onclick=spin;
 `;
 d.body.appendChild(s);
});
</script>
</body>
</html>
