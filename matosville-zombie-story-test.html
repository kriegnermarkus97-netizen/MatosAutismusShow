<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matosville Zombie Story – Testversion</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090b10;color:#fff;font-family:Impact,'Arial Black',sans-serif}button{font:inherit;cursor:pointer}.app{min-height:100vh;background:radial-gradient(circle at 50% 15%,#23334a 0,#111522 38%,#08090d 100%);padding:18px}.frame{max-width:1280px;margin:auto;border:6px solid #080808;box-shadow:0 0 0 3px #f0c86b,10px 12px 0 #000;background:#15151a;min-height:calc(100vh - 36px);position:relative;overflow:hidden}.top{background:#111;border-bottom:5px solid #000;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px}.logo{font-size:clamp(24px,4vw,48px);color:#ffd35a;text-shadow:3px 3px #c4202e,-2px -2px #000;transform:rotate(-1deg)}.sub{color:#ef3340}.small{font-family:Arial,sans-serif;font-weight:900;color:#ddd}.screen{display:none;min-height:700px}.screen.on{display:block}.map{padding:24px;background:linear-gradient(#2f91c7 0 26%,#ffb03a 26% 43%,#d16b2e 43% 100%);position:relative;overflow:hidden}.map:before{content:'';position:absolute;inset:43% 0 0;background:repeating-linear-gradient(100deg,transparent 0 80px,#b94f24 82px 84px)}.map h1,.comic h1,.fight h1{position:relative;text-align:center;margin:5px 0 22px;font-size:clamp(34px,5vw,66px);text-shadow:4px 4px #000;-webkit-text-stroke:2px #111}.road{position:relative;margin:40px auto 20px;max-width:1100px;display:flex;justify-content:space-between;align-items:center;gap:4px}.road:before{content:'';position:absolute;height:16px;left:4%;right:4%;top:50%;background:#333;border:4px solid #111;transform:translateY(-50%);box-shadow:0 0 0 4px #e7bb42 inset}.node{z-index:2;width:108px;min-height:108px;border-radius:50%;border:5px solid #111;background:#e9cf8e;color:#111;display:grid;place-items:center;text-align:center;padding:7px;box-shadow:5px 5px #000;font-size:15px}.node.done{background:#64b96b}.node.current{background:#ffcf37;transform:scale(1.12);animation:pulse 1s infinite alternate}.node.lock{filter:grayscale(1);opacity:.65}.walker{position:relative;text-align:center;font-size:50px;margin:5px}.go,.next,.attack,.backmap{border:4px solid #111;background:#d82932;color:#fff;padding:12px 22px;box-shadow:5px 5px #000;font-size:24px;transform:rotate(-1deg)}.center{text-align:center;position:relative}.comic{padding:20px;background:#e9c47e;color:#111}.comic h1{color:#ffd54e}.pages{max-width:1120px;margin:auto}.page{display:none}.page.on{display:grid;grid-template-columns:1.2fr .8fr;gap:10px}.panel{min-height:410px;border:6px solid #111;background:linear-gradient(#44a9df 0 48%,#f28c35 48%);position:relative;overflow:hidden;padding:20px;box-shadow:6px 6px #000}.panel.dark{background:linear-gradient(#172234,#4c2924)}.panel:after{content:'';position:absolute;inset:0;background-image:radial-gradient(#0005 1px,transparent 1px);background-size:6px 6px;pointer-events:none}.scene{position:absolute;left:0;right:0;bottom:0;height:46%;background:#b95e2c;clip-path:polygon(0 35%,15% 22%,29% 38%,45% 15%,60% 36%,78% 10%,100% 31%,100% 100%,0 100%)}.chars{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:28px;z-index:3}.char{width:115px;height:170px;border:5px solid #111;border-radius:52% 52% 35% 35%;background:#e8b980;position:relative;box-shadow:4px 4px #000}.char:before{content:'';position:absolute;width:76px;height:42px;left:15px;top:57px;background:#fff;border:4px solid #111;border-radius:50%}.char:after{position:absolute;left:5px;right:5px;bottom:8px;text-align:center;color:#fff;font-size:15px}.lul{box-shadow:inset 0 -70px #111,4px 4px #000}.lul:after{content:'ICH BIN GOTT'}.elo{box-shadow:inset 0 -70px #d96982,4px 4px #000}.elo:after{content:'EIOQUEEN'}.bubble{position:absolute;z-index:5;background:#fff;border:4px solid #111;border-radius:50%;padding:15px;max-width:250px;font-size:19px;line-height:1.05;box-shadow:3px 3px #000}.b1{left:4%;top:10%}.b2{right:4%;top:18%}.narr{border:5px solid #111;background:#f7dfaa;padding:18px;font-family:Arial,sans-serif;font-weight:900;font-size:18px;line-height:1.45;box-shadow:5px 5px #000;display:flex;flex-direction:column;justify-content:center}.pager{display:flex;justify-content:center;gap:12px;margin:20px}.fight{padding:24px;min-height:700px;background:linear-gradient(#5b2027,#17131b);text-align:center}.arena{max-width:1050px;height:430px;margin:15px auto;border:6px solid #111;background:linear-gradient(#d54b2f 0 42%,#5a382a 42%);position:relative;overflow:hidden;box-shadow:7px 7px #000}.enemy{position:absolute;right:15%;bottom:65px;font-size:120px;filter:drop-shadow(6px 6px #000)}.heroes{position:absolute;left:10%;bottom:55px;font-size:80px}.hp{max-width:850px;margin:10px auto;height:30px;border:4px solid #111;background:#38151b}.hp i{display:block;height:100%;width:100%;background:#45bd63;transition:.25s}.status{font-family:Arial,sans-serif;font-weight:900;margin:10px}.attack{background:#ffcc35;color:#111;margin:10px}.hidden{display:none!important}@keyframes pulse{to{transform:scale(1.2)}}@media(max-width:760px){.road{display:grid;grid-template-columns:repeat(2,1fr);justify-items:center}.road:before{display:none}.page.on{grid-template-columns:1fr}.panel{min-height:360px}.screen{min-height:780px}}
</style></head><body><div class="app"><div class="frame"><div class="top"><div class="logo">MATOSVILLE <span class="sub">ZOMBIE STORY</span></div><div class="small">TEIL 1 · TESTVERSION</div></div>
<section id="map" class="screen map on"><h1>KAPITEL-SPIELFELD</h1><div class="road" id="road"></div><div class="walker">👣</div><div class="center"><p class="small" id="mapText"></p><button class="go" id="go">KAPITEL STARTEN ➜</button></div></section>
<section id="comic" class="screen comic"><h1 id="comicTitle"></h1><div class="pages"><div id="comicPage" class="page on"><div class="panel" id="visual"><div class="scene"></div><div class="bubble b1" id="b1"></div><div class="bubble b2" id="b2"></div><div class="chars"><div class="char lul"></div><div class="char elo"></div></div></div><div class="narr"><div id="story"></div></div></div></div><div class="pager"><button class="next" id="comicNext">WEITER ➜</button></div></section>
<section id="fight" class="screen fight"><h1 id="fightTitle">KAMPF!</h1><div class="status" id="fightText"></div><div class="hp"><i id="enemyHp"></i></div><div class="arena"><div class="heroes">👩🏻‍🦱 🔫 👩🏻 🔫</div><div class="enemy" id="enemy">🧟</div></div><button class="attack" id="attack">💥 ANGREIFEN</button></section>
</div></div><script>
const chapters=[
{t:'DIE VERLASSENE WASSERBÜFFELFARM',icon:'🐃',enemy:'🐃',pre:[['SCHEISSE... KEIN BENZIN MEHR!','OCH DIGGI! TYPISCH WIR...','LULNEY und EIOQUEEN wollen eigentlich nur Urlaub in Matosville machen. Mitten in der Wüste geht ihnen jedoch das Benzin aus. In der Nähe entdecken sie Matos Wasserbüffelfarm.'],['HIER IST JA ALLES VERLASSEN...','OCH DIGGI... HIER STIMMT DOCH WAS NICHT.','Auf der Farm ist keine Menschenseele. Aus dem Stall kommen plötzlich unheimliche Geräusche.']],post:[['WAS ZUR HÖLLE WAR DAS?!','OCH DIGGI... EIN INFIZIERTER WASSERBÜFFEL?!','Nach ihrem ersten Kampf ist klar: Hier stimmt etwas ganz und gar nicht. Benzin finden sie keines.'],['DANN EBEN ZU FUSS. SCHEISS DRAUF.','OCH DIGGI... DAS KANN JA WAS WERDEN.','Sie lassen das Auto zurück und machen sich zu Fuß auf den Weg nach Matosville.']]},
{t:'DURCH DIE WÜSTE',icon:'🌵',enemy:'🧟',pre:[['WIE WEIT IST DIE SCHEISS STADT NOCH?!','OCH DIGGI... FRAG MICH DOCH NICHT!','Die beiden ziehen zu Fuß durch die heiße Wüste. Lange begegnet ihnen niemand.'],['DA VORNE SIND LEUTE!','OCH DIGGI... ENDLICH NORMALE MENSCHEN. ODER?','Dann tauchen Bewohner von Matosville auf. Doch ihre Bewegungen wirken alles andere als normal.']],post:[['DIE SIND KOMPLETT DURCHGEDREHT!','OCH DIGGI! UND NOCH SO EIN BÜFFEL!','Nach dem Kampf wissen sie endgültig, dass sich eine Infektion ausgebreitet hat.'],['WEITER. ICH WILL WISSEN WAS DA LOS IST.','OCH DIGGI... DAS WAR ERST DER ANFANG.','Trotzdem gehen sie weiter. Am Horizont erscheint schließlich Matosville.']]},
{t:'WILLKOMMEN IN MATOSVILLE',icon:'🚧',enemy:'🧟‍♂️',pre:[['QUARANTÄNE? NA SUPER.','OCH DIGGI... HIER IST JA NIEMAND.','Vor Matosville stoßen sie auf eine verlassene Quarantäne-Sperre. Dahinter liegt eine vollkommen stille Stadt.'],['WAS ZUM TEUFEL IST HIER PASSIERT?','OCH DIGGI... WARTE MAL, DAS IST DOCH...','Durch Zufall entdecken sie einen Hinweis: Ein gemeinsamer Freund hatte hier vor einiger Zeit Urlaub gemacht und ist seitdem verschwunden.']],post:[['JETZT SUCHEN WIR IHN.','OCH DIGGI... SEINE SPUR FÜHRT ZUM FRISEUR.','Nach dem Kampf wird aus ihrem Urlaub endgültig eine Rettungsmission. Die erste echte Spur führt zum Friseursalon.']]},
{t:'DER FRISEURSALON',icon:'✂️',enemy:'🧟‍♀️',pre:[['DER LADEN SIEHT BESCHISSEN AUS.','OCH DIGGI... ER WAR WIRKLICH HIER.','Zwischen verlassenen Stühlen und zerbrochenen Spiegeln finden sie einen eindeutigen Hinweis ihres Freundes.'],['ICH HÖR WAS...','OCH DIGGI! HINTER UNS!','Doch sie sind im Salon nicht allein. Infizierte kommen aus den hinteren Räumen.']],post:[['DAS WAR KNAPP.','OCH DIGGI... HIER! EINE NACHRICHT!','Nach dem Kampf finden sie eine weitere Nachricht. Ihr Freund hat den Salon verlassen.'],['NÄCHSTER HALT: SALOON.','OCH DIGGI... NATÜRLICH DER SALOON.','Die Spur führt tiefer in die Stadt – zum alten Saloon von Matosville.']]},
{t:'DER SALOON',icon:'🍺',enemy:'🧟‍♂️',pre:[['NA TOLL. EIN ZOMBIE-SALOON.','OCH DIGGI... BESTIMMT WIEDER EIN VOLLTREFFER.','Der Saloon wirkt noch stärker verwüstet als der Rest der Stadt. Hier scheint die Infektion besonders heftig gewütet zu haben.'],['DA IST SEIN ZEICHEN.','OCH DIGGI... IHM IST HIER ETWAS PASSIERT.','Sie finden eine weitere Spur. Zum ersten Mal deutet alles darauf hin, dass ihr Freund nicht nur verschwunden ist.']],post:[['SCHEISSE... DIE WAREN ÜBERALL.','OCH DIGGI... RATHAUSPLATZ. DA MÜSSEN WIR HIN.','Nach dem Kampf entdecken sie den letzten Hinweis. Die Spur endet am Rathausplatz.']]},
{t:'DER RATHAUSPLATZ',icon:'⭐',enemy:'🧟‍♂️',pre:[['DAS SIND VIEL ZU VIELE!','OCH DIGGI... WIR MÜSSEN DA DURCH!','Vor dem Rathaus wartet die größte Horde bisher. Hinter ihnen liegt die ganze Reise – vor ihnen möglicherweise ihr Freund.']],post:[['ICH GLAUB ES NICHT...','OCH DIGGI... ER IST IM RATHAUS.','Nach der Schlacht finden sie die entscheidende Nachricht: Ihr Freund befindet sich im Rathaus.'],['DANN BRINGEN WIR DAS ZU ENDE.','OCH DIGGI... EGAL WAS DA DRIN IST.','LULNEY und EIOQUEEN betreten das dunkle Rathaus.']]},
{t:'DAS RATHAUS',icon:'🏛️',enemy:'👹',pre:[['KEINEN SCHRITT ZURÜCK.','OCH DIGGI... WAS ERWARTET UNS DA DRIN?','Im dunklen Rathaus folgen sie den letzten Spuren bis in den großen Saal. Dort finden sie endlich ihren verschwundenen Freund.'],['SCHEISSE... DAS IST ER.','OCH DIGGI... WAS HABEN SIE MIT DIR GEMACHT?!','Er ist infiziert und kaum wiederzuerkennen. Der letzte Kampf beginnt.']],post:[['...','OCH DIGGI... ER KOMMT WIEDER ZU SICH!','Schwer verletzt liegt ihr Freund am Boden. Für einen kurzen Moment verschwindet die Infektion aus seinem Blick.'],['DU... ERKENNST UNS?','Ihr... seid wirklich gekommen...','Er erkennt die beiden. Was danach geschieht, bleibt verborgen. Kein Schuss. Keine Rettung. Nur Schwarz. ENDE – TEIL 1.']]}
];
let unlocked=0,current=0,phase='pre',page=0,hp=100;
const $=id=>document.getElementById(id);function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));$(id).classList.add('on')}
function drawMap(){let r=$('road');r.innerHTML='';chapters.forEach((c,i)=>{let n=document.createElement('div');n.className='node '+(i<unlocked?'done':i===unlocked?'current':'lock');n.innerHTML=`<b>${c.icon}<br>KAPITEL ${i+1}</b><small>${c.t}</small>`;r.appendChild(n)});$('mapText').textContent=unlocked<7?`NÄCHSTES ZIEL: KAPITEL ${unlocked+1} – ${chapters[unlocked].t}`:'TEIL 1 ABGESCHLOSSEN';$('go').textContent=unlocked<7?'KAPITEL STARTEN ➜':'NOCHMAL VON VORNE'}
function loadComic(){let c=chapters[current],arr=c[phase];let p=arr[page];$('comicTitle').textContent=`KAPITEL ${current+1} · ${c.t}`;$('b1').textContent=p[0];$('b2').textContent=p[1];$('story').textContent=p[2];$('visual').classList.toggle('dark',current>=3);$('comicNext').textContent=(page<arr.length-1)?'NÄCHSTE COMICSEITE ➜':phase==='pre'?'ZUM KAMPF! 💥':'ZURÜCK ZUM SPIELFELD ➜';show('comic')}
$('go').onclick=()=>{if(unlocked>=7){unlocked=0;drawMap();return}current=unlocked;phase='pre';page=0;loadComic()};$('comicNext').onclick=()=>{let arr=chapters[current][phase];if(page<arr.length-1){page++;loadComic();return}if(phase==='pre'){hp=100;$('enemyHp').style.width='100%';$('enemy').textContent=chapters[current].enemy;$('fightTitle').textContent=`KAPITEL ${current+1} · KAMPF`;$('fightText').textContent='Besiege die Gegner, um die Geschichte fortzusetzen.';show('fight')}else{unlocked=Math.max(unlocked,current+1);drawMap();show('map')}};
$('attack').onclick=()=>{hp-=25;$('enemyHp').style.width=Math.max(0,hp)+'%';$('fightText').textContent=hp>0?['TREFFER!','OCH DIGGI! WEITER!','SCHEISSE, DER STEHT IMMER NOCH!'][Math.floor(Math.random()*3)]:'KAMPF GEWONNEN!';if(hp<=0)setTimeout(()=>{phase='post';page=0;loadComic()},550)};drawMap();
</script></body></html>
