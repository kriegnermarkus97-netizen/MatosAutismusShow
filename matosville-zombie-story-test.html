<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matosville Zombie Story – Comic Test</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#07080c;color:#fff;font-family:Impact,'Arial Black',sans-serif}button{font:inherit;cursor:pointer}.app{min-height:100vh;background:radial-gradient(circle at 50% 0,#24354f 0,#101522 38%,#06070a 100%);padding:14px}.frame{max-width:1280px;margin:auto;border:6px solid #090909;box-shadow:0 0 0 3px #e5b85b,10px 12px 0 #000;background:#16161b;min-height:calc(100vh - 28px);overflow:hidden}.top{background:#0d0d10;border-bottom:5px solid #000;padding:10px 16px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:clamp(24px,4vw,48px);color:#ffd35a;text-shadow:3px 3px #c4202e,-2px -2px #000;transform:rotate(-1deg)}.logo span{color:#ef3340}.small{font-family:Arial,sans-serif;font-weight:900;color:#ddd}.screen{display:none;min-height:720px}.screen.on{display:block}.comicTitle,.fightTitle,.mapTitle{text-align:center;margin:10px 0 18px;font-size:clamp(34px,5vw,64px);color:#ffd55a;-webkit-text-stroke:2px #101010;text-shadow:4px 4px #000;transform:rotate(-1deg)}

.sceneBg{position:absolute;inset:0}.desert{background:linear-gradient(#3b8bc6 0 33%,#ff9b37 33% 55%,#c9692c 55%)}.desert:before{content:'🌵   🌵      🌵          🌵';position:absolute;bottom:90px;left:4%;right:4%;font-size:70px;letter-spacing:35px;opacity:.9}.farm{background:linear-gradient(#2f91c8 0 34%,#ff9b35 34% 48%,#bb6b34 48%)}.farm:before{content:'MATO\'S WATERBUFFALO FARM';position:absolute;left:8%;top:38%;padding:12px;background:#a9743f;color:#111;border:5px solid #111;font-size:30px;transform:rotate(-2deg)}.farm:after{content:'🏚️   🛖   🐃';position:absolute;right:6%;bottom:70px;font-size:94px}.city{background:linear-gradient(#2678aa 0 30%,#e57c30 30% 48%,#80552f 48%)}.city:before{content:'🏚️  🏚️  🏛️  🏚️  🏚️';position:absolute;bottom:75px;left:3%;font-size:84px}.barber{background:linear-gradient(#122235 0 42%,#5d3448 42%)}.barber:before{content:'✂ HAIR & NAILS SALON ✂';position:absolute;top:22%;left:12%;right:12%;text-align:center;background:#1b1b25;color:#ff62d9;border:5px solid #111;padding:16px;font-size:34px}.saloon{background:linear-gradient(#32241e 0 38%,#6f4429 38%)}.saloon:before{content:'SALOON';position:absolute;top:18%;left:24%;right:24%;text-align:center;background:#9b6335;color:#15100b;border:5px solid #111;padding:16px;font-size:52px}.square{background:linear-gradient(#2e87b9 0 32%,#e8a548 32% 47%,#9b6938 47%)}.square:before{content:'🏚️   🏛️   🏚️';position:absolute;bottom:85px;left:12%;font-size:108px}.townhall{background:linear-gradient(#08111f 0 55%,#281b1d 55%)}.townhall:before{content:'🏛️';position:absolute;font-size:250px;left:50%;bottom:18px;transform:translateX(-50%);filter:brightness(.72)}.roadSign{position:absolute;right:5%;bottom:38%;z-index:4;background:#d9b56b;color:#111;border:5px solid #111;padding:12px;font-size:24px;transform:rotate(2deg)}

<section id="map" class="screen map on"><h1 class="mapTitle">KAPITEL-SPIELFELD</h1><div class="mapBoard"><div class="route"><div class="routeLine"></div><div class="nodes" id="nodes"></div></div><div class="mapActions"><div class="small" id="mapText" style="color:#111;margin-bottom:12px"></div><button class="btn" id="startChapter">KAPITEL STARTEN ➜</button></div></div></section>
<section id="comic" class="screen comic"><h1 class="comicTitle" id="comicTitle"></h1><div class="comicWrap"><div class="comicPage fade"><div class="visual" id="visual"><div class="sceneBg" id="sceneBg"></div><div class="speech s1" id="s1"></div><div class="speech s2" id="s2"></div><div class="heroes"><div class="hero lul"><div class="hair"></div></div><div class="hero elo"><div class="hair"></div></div></div><div class="roadSign" id="sign"></div></div><div class="narr"><div class="tag" id="phaseTag"></div><div id="story"></div></div></div><div class="pager"><div class="pageCount" id="pageCount"></div><button class="btn" id="comicNext">WEITER ➜</button></div></div></section>
<section id="fight" class="screen fight"><h1 class="fightTitle" id="fightTitle">KAMPF!</h1><div class="fightSub" id="fightSub"></div><div class="hp"><i id="enemyHp"></i></div><div class="arena" id="arena"><div class="sceneBg" id="fightBg"></div><div class="fightHeroes">👩🏻‍🦱🔫 &nbsp; 👩🏻🔫</div><div class="enemy" id="enemy"></div><div class="enemyName" id="enemyName"></div></div><div class="fightActions"><button class="btn attack" id="attack">💥 ANGREIFEN</button></div></section>
<section id="ending" class="screen"><div class="endCard"><h2>ENDE – TEIL 1</h2><p style="font:900 19px/1.5 Arial,sans-serif">Für einen Moment erkennt ihr Freund LULNEY und EIOQUEEN wieder. Dann wird alles schwarz. Ob sie ihn retten konnten oder was danach geschah, bleibt offen.</p><button class="btn" id="restart">NOCHMAL SPIELEN</button></div></section>
</div></div><script>
const C=[
{t:'DIE VERLASSENE WASSERBÜFFELFARM',icon:'🐃',bg:'farm',sign:'MATO’S WATERBUFFALO FARM',enemy:'🐃',enemyName:'INFIZIERTER WASSERBÜFFEL',pre:[['SCHEISSE... KEIN BENZIN MEHR!','OCH DIGGI! TYPISCH WIR...','LULNEY und EIOQUEEN wollen eigentlich nur Urlaub in Matosville machen. Mitten in der Wüste geht ihnen das Benzin aus. Zum Glück entdecken sie Matos Wasserbüffelfarm.'],['HIER IST JA ALLES VERLASSEN...','OCH DIGGI... HIER STIMMT DOCH WAS NICHT.','Auf der Farm ist keine Menschenseele. Türen stehen offen, Werkzeuge liegen herum und aus dem Stall kommen unheimliche Geräusche.']],post:[['WAS ZUR HÖLLE WAR DAS?!','OCH DIGGI... EIN INFIZIERTER WASSERBÜFFEL?!','Nach dem ersten Kampf ist klar: Hier stimmt etwas ganz und gar nicht. Benzin finden sie keines.'],['DANN EBEN ZU FUSS. SCHEISS DRAUF.','OCH DIGGI... DAS KANN JA WAS WERDEN.','Sie lassen das Auto zurück und machen sich zu Fuß auf den Weg nach Matosville.']]},
{t:'DURCH DIE WÜSTE',icon:'🌵',bg:'desert',sign:'MATOSVILLE → NOCH XX KM',enemy:'🧟',enemyName:'INFIZIERTE BEWOHNER + BÜFFEL',pre:[['WIE WEIT IST DIE SCHEISS STADT NOCH?!','OCH DIGGI... FRAG MICH DOCH NICHT!','Die beiden ziehen zu Fuß durch die heiße Wüste. Lange begegnet ihnen niemand.'],['DA VORNE SIND LEUTE!','OCH DIGGI... ENDLICH NORMALE MENSCHEN. ODER?','Dann tauchen Bewohner von Matosville auf. Ihre Bewegungen wirken jedoch alles andere als normal.']],post:[['DIE SIND KOMPLETT DURCHGEDREHT!','OCH DIGGI! UND NOCH SO EIN BÜFFEL!','Nach dem Kampf wissen sie endgültig, dass sich eine Infektion ausgebreitet hat.'],['WEITER. ICH WILL WISSEN WAS DA LOS IST.','OCH DIGGI... DAS WAR ERST DER ANFANG.','Trotzdem gehen sie weiter. Am Horizont erscheint schließlich Matosville.']]},
{t:'WILLKOMMEN IN MATOSVILLE',icon:'🚧',bg:'city',sign:'QUARANTÄNE-SPERRZONE',enemy:'🧟‍♂️',enemyName:'INFIZIERTE AM STADTTOR',pre:[['QUARANTÄNE? NA SUPER.','OCH DIGGI... HIER IST JA NIEMAND.','Vor Matosville stoßen sie auf eine verlassene Quarantäne-Sperre. Dahinter liegt eine vollkommen stille Stadt.'],['WAS ZUM TEUFEL IST HIER PASSIERT?','OCH DIGGI... WARTE MAL, DAS IST DOCH...','Durch Zufall entdecken sie einen Hinweis: Ein gemeinsamer Freund hatte hier vor einiger Zeit Urlaub gemacht und ist seitdem verschwunden.']],post:[['JETZT SUCHEN WIR IHN.','OCH DIGGI... SEINE SPUR FÜHRT ZUM FRISEUR.','Nach dem Kampf wird aus ihrem Urlaub endgültig eine Rettungsmission. Die erste echte Spur führt zum Friseursalon.']]},
{t:'DER FRISEURSALON',icon:'✂️',bg:'barber',sign:'HAIR & NAILS · OPEN?',enemy:'🧟‍♀️',enemyName:'INFIZIERTE IM SALON',pre:[['DER LADEN SIEHT BESCHISSEN AUS.','OCH DIGGI... ER WAR WIRKLICH HIER.','Zwischen verlassenen Stühlen und zerbrochenen Spiegeln finden sie einen eindeutigen Hinweis ihres Freundes.'],['ICH HÖR WAS...','OCH DIGGI! HINTER UNS!','Doch sie sind im Salon nicht allein. Infizierte kommen aus den hinteren Räumen.']],post:[['DAS WAR KNAPP.','OCH DIGGI... HIER! EINE NACHRICHT!','Nach dem Kampf finden sie eine weitere Nachricht. Ihr Freund hat den Salon verlassen.'],['NÄCHSTER HALT: SALOON.','OCH DIGGI... NATÜRLICH DER SALOON.','Die Spur führt tiefer in die Stadt – zum alten Saloon von Matosville.']]},
{t:'DER SALOON',icon:'🍺',bg:'saloon',sign:'SALOON · LETZTE SPUR',enemy:'🧟‍♂️',enemyName:'SALOON-HORDE',pre:[['NA TOLL. EIN ZOMBIE-SALOON.','OCH DIGGI... BESTIMMT WIEDER EIN VOLLTREFFER.','Der Saloon wirkt noch stärker verwüstet als der Rest der Stadt. Hier scheint die Infektion besonders heftig gewütet zu haben.'],['DA IST SEIN ZEICHEN.','OCH DIGGI... IHM IST HIER ETWAS PASSIERT.','Sie finden eine weitere Spur. Zum ersten Mal deutet alles darauf hin, dass ihr Freund nicht nur verschwunden ist.']],post:[['SCHEISSE... DIE WAREN ÜBERALL.','OCH DIGGI... RATHAUSPLATZ. DA MÜSSEN WIR HIN.','Nach dem Kampf entdecken sie den letzten Hinweis. Die Spur endet am Rathausplatz.']]},
{t:'DER RATHAUSPLATZ',icon:'⭐',bg:'square',sign:'RATHAUS · DIE WAHRHEIT',enemy:'🧟‍♂️',enemyName:'DIE GROSSE HORDE',pre:[['DAS SIND VIEL ZU VIELE!','OCH DIGGI... WIR MÜSSEN DA DURCH!','Vor dem Rathaus wartet die größte Horde bisher. Hinter ihnen liegt die ganze Reise – vor ihnen möglicherweise ihr Freund.']],post:[['ICH GLAUB ES NICHT...','OCH DIGGI... ER IST IM RATHAUS.','Nach der Schlacht finden sie die entscheidende Nachricht: Ihr Freund befindet sich im Rathaus.'],['DANN BRINGEN WIR DAS ZU ENDE.','OCH DIGGI... EGAL WAS DA DRIN IST.','LULNEY und EIOQUEEN betreten das dunkle Rathaus.']]},
{t:'DAS RATHAUS',icon:'🏛️',bg:'townhall',sign:'KEINEN SCHRITT ZURÜCK',enemy:'👹',enemyName:'DER VERSCHWUNDENE FREUND',pre:[['KEINEN SCHRITT ZURÜCK.','OCH DIGGI... WAS ERWARTET UNS DA DRIN?','Im dunklen Rathaus folgen sie den letzten Spuren bis in den großen Saal. Dort finden sie endlich ihren verschwundenen Freund.'],['SCHEISSE... DAS IST ER.','OCH DIGGI... WAS HABEN SIE MIT DIR GEMACHT?!','Er ist infiziert und kaum wiederzuerkennen. Der letzte Kampf beginnt.']],post:[['...','OCH DIGGI... ER KOMMT WIEDER ZU SICH!','Schwer verletzt liegt ihr Freund am Boden. Für einen kurzen Moment verschwindet die Infektion aus seinem Blick.'],['DU... ERKENNST UNS?','Ihr... seid wirklich gekommen...','Er erkennt die beiden. Was danach geschieht, bleibt verborgen. Kein Schuss. Keine Rettung. Nur Schwarz.']]}
];
let unlocked=0,current=0,phase='pre',page=0,hp=100;const $=x=>document.getElementById(x);function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on')}
function map(){const n=$('nodes');n.innerHTML='';C.forEach((c,i)=>{const d=document.createElement('div');d.className='node '+(i<unlocked?'done':i===unlocked?'current':'lock');d.innerHTML=`<strong>${c.icon} KAPITEL ${i+1}</strong>${c.t}<br><small>${i<unlocked?'GESCHAFFT':i===unlocked?'NÄCHSTES ZIEL':'🔒 GESPERRT'}</small>`;n.appendChild(d)});$('mapText').textContent=unlocked<7?`LULNEY & EIOQUEEN bewegen sich weiter: Kapitel ${unlocked+1} wartet.`:'Alle Kapitel abgeschlossen.';$('startChapter').style.display=unlocked<7?'inline-block':'none'}
function comic(){const c=C[current],arr=c[phase],p=arr[page];$('comicTitle').textContent=`KAPITEL ${current+1} · ${c.t}`;$('sceneBg').className='sceneBg '+c.bg;$('s1').textContent=p[0];$('s2').textContent=p[1];$('story').textContent=p[2];$('sign').textContent=c.sign;$('phaseTag').textContent=phase==='pre'?'COMIC · VOR DEM KAMPF':'COMIC · NACH DEM KAMPF';$('pageCount').textContent=`SEITE ${page+1} / ${arr.length}`;$('comicNext').textContent=(page===arr.length-1&&phase==='pre')?'ZUM KAMPF ➜':(page===arr.length-1&&phase==='post')?(current===6?'ENDE ANSEHEN ➜':'ZURÜCK ZUM SPIELFELD ➜'):'WEITER ➜';show('comic')}
function fight(){const c=C[current];hp=100;$('enemyHp').style.width='100%';$('fightTitle').textContent=`KAPITEL ${current+1} · KAMPF`;$('fightSub').textContent=c.enemyName;$('fightBg').className='sceneBg '+c.bg;$('enemy').textContent=c.enemy;$('enemyName').textContent=c.enemyName;show('fight')}
$('startChapter').onclick=()=>{current=unlocked;phase='pre';page=0;comic()};$('comicNext').onclick=()=>{const arr=C[current][phase];if(page<arr.length-1){page++;comic();return}if(phase==='pre'){fight();return}if(current===6){show('ending');return}unlocked=current+1;map();show('map')};$('attack').onclick=()=>{hp-=25+Math.floor(Math.random()*16);if(hp<0)hp=0;$('enemyHp').style.width=hp+'%';if(hp===0){phase='post';page=0;setTimeout(comic,250)}};$('restart').onclick=()=>{unlocked=0;current=0;phase='pre';page=0;map();show('map')};map();
</script></body></html>
